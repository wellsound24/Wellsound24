<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Well License">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.svg">
<link rel="apple-touch-icon" href="/icon-192.svg">
<title>ติดตั้ง Well License Standard 6</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#13243c 0,#080d14 45%,#05090f 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);background:rgba(15,26,42,.96);border:1px solid #263952;border-radius:24px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.38)}.logo{width:88px;height:88px;margin:0 auto 16px;display:block}.eyebrow{text-align:center;color:#55dfb4;font-size:12px;font-weight:800;letter-spacing:.7px}.title{text-align:center;font-size:25px;font-weight:850;margin:6px 0}.sub{text-align:center;color:#a9b5c7;font-size:14px;line-height:1.55;margin-bottom:22px}.btn{width:100%;border:0;border-radius:14px;min-height:54px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.install{background:#25dba6;color:#06120f}.install:disabled{opacity:.55;cursor:wait}.open{margin-top:10px;background:#17263a;color:#dbe7f5;border:1px solid #2c405a}.status{min-height:22px;text-align:center;color:#98a8bc;font-size:12px;margin-top:14px}.help{display:none;margin-top:17px;padding:14px;border-radius:14px;background:#0b1421;border:1px solid #22334a;color:#c8d3e1;font-size:13px;line-height:1.55}.help b{color:#fff}.ok{color:#55dfb4}.warn{color:#f2bd5b}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="/icon-192.svg" alt="Well License">
<div class="eyebrow">STANDARD 6</div>
<div class="title">Well License Dashboard</div>
<div class="sub">ติดตั้งบนมือถือแล้วเปิดใช้งานเหมือนแอป โดยยังใช้ระบบและข้อมูลของมาตรฐาน 6 ตัวเดิม</div>
<button id="installBtn" class="btn install" type="button" disabled>กำลังเตรียมตัวติดตั้ง...</button>
<button id="openBtn" class="btn open" type="button">เปิดมาตรฐาน 6</button>
<div id="status" class="status"></div>
<div id="help" class="help"></div>
</main>
<script>
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
const status=document.getElementById('status');
const help=document.getElementById('help');
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{})}

document.getElementById('openBtn').addEventListener('click',()=>location.href='/well6');

function showManual(){
  installBtn.disabled=false;
  if(isIOS){
    installBtn.textContent='วิธีติดตั้งบน iPhone / iPad';
    status.textContent='iOS ต้องยืนยันผ่านเมนูของ Safari';
    help.style.display='block';
    help.innerHTML='<b>Safari:</b> กดปุ่ม Share (สี่เหลี่ยมมีลูกศรขึ้น) → <b>Add to Home Screen / เพิ่มไปยังหน้าจอโฮม</b> → Add';
  }else{
    installBtn.textContent='ติดตั้ง Well License';
    status.textContent='ถ้าเมนูติดตั้งไม่ขึ้น ให้ใช้ Chrome';
    help.style.display='block';
    help.innerHTML='<b>Android Chrome:</b> กดเมนู ⋮ → <b>ติดตั้งแอป / Add to Home screen</b> แล้วกดติดตั้ง';
  }
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  installBtn.disabled=false;installBtn.textContent='ติดตั้ง Well License';
  status.innerHTML='<span class="ok">พร้อมติดตั้งแล้ว</span>';
  help.style.display='none';
});

window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;installBtn.disabled=true;installBtn.textContent='ติดตั้งเรียบร้อยแล้ว';status.innerHTML='<span class="ok">พบไอคอน Well License บนหน้าจอมือถือแล้ว</span>';
});

installBtn.addEventListener('click',async()=>{
  if(isStandalone){location.href='/well6';return}
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice=await deferredPrompt.userChoice;
    if(choice.outcome==='accepted'){status.textContent='กำลังติดตั้ง...'}else{status.textContent='ยกเลิกการติดตั้งแล้ว'}
    deferredPrompt=null;
    return;
  }
  showManual();
});

if(isStandalone){installBtn.disabled=false;installBtn.textContent='เปิด Well License';status.innerHTML='<span class="ok">ติดตั้งอยู่บนเครื่องนี้แล้ว</span>'}
else setTimeout(()=>{if(!deferredPrompt)showManual()},2200);
</script>
</body>
</html>
