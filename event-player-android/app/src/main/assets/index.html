<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Wellsound24 Event Player</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--panel2:#1d2330;--line:#2a3242;--text:#f7f9fc;--muted:#9aa6b8;--green:#31d7a9;--yellow:#ffc857;--red:#ff5f68;--blue:#4da3ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;min-height:100%;overscroll-behavior:none}button,input,select{font:inherit}.app{max-width:1400px;margin:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand b{font-size:20px;letter-spacing:.7px}.brand div{font-size:12px;color:var(--muted)}.badge{padding:7px 10px;border-radius:999px;background:#123b31;color:#75f0cf;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:1.05fr 1.4fr;gap:14px}.card{background:linear-gradient(180deg,var(--panel),#11151d);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 30px #0005}.card h2{font-size:16px;margin:0 0 10px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.btn{border:1px solid #384256;background:#202736;color:var(--text);padding:11px 13px;border-radius:12px;font-weight:700;min-height:44px}.btn:active{transform:scale(.98)}.primary{background:var(--green);border-color:var(--green);color:#06130f}.danger{background:#3b171b;border-color:#74272e;color:#ffb5ba}.warn{background:#3b3014;border-color:#69531e;color:#ffe09a}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.cue-list{display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:47vh;overflow:auto}.cue{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:9px}.cue.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}.cue.done{opacity:.55}.num{font-weight:900;color:var(--green);text-align:center}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.sub{font-size:11px;color:var(--muted)}.mini{border:0;border-radius:9px;background:#30394b;color:white;padding:8px}.empty{border:1px dashed #364055;border-radius:13px;color:var(--muted);text-align:center;padding:24px 12px}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad{min-height:96px;border:1px solid #334055;border-radius:15px;background:linear-gradient(145deg,#253047,#182030);color:white;text-align:left;padding:12px;position:relative;overflow:hidden}.pad.playing{outline:2px solid var(--green);box-shadow:0 0 24px #31d7a955}.pad .key{position:absolute;right:9px;top:8px;color:#8da0b9;font-size:11px}.pad .title{font-weight:900;line-height:1.2;padding-right:18px}.pad .meta{font-size:11px;color:#b1bed0;margin-top:7px}.pad.empty-pad{border-style:dashed;color:#8190a6}.player{margin-top:14px}.now{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.now-title{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-sub{color:var(--muted);font-size:12px;margin-top:3px}.time{font-variant-numeric:tabular-nums;font-weight:800}.progress{width:100%;accent-color:var(--green);margin:13px 0 8px}.controls{display:flex;flex-wrap:wrap;gap:8px}.volume-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}.volume-row input{width:100%;accent-color:var(--green)}.go{font-size:22px;min-width:100px}.footer{color:#687488;font-size:11px;text-align:center;margin-top:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#f4f7fb;color:#111722;padding:10px 14px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.pads{grid-template-columns:repeat(2,1fr)}.cue-list{max-height:32vh}.pad{min-height:90px}}@media(min-width:1100px){.pads{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><b>WELLSOUND24</b><div>EVENT PLAYER • OFFLINE</div></div><div class="badge">พร้อมใช้งาน</div></div>
  <div class="grid">
    <section class="card">
      <h2>คิวงาน</h2>
      <div class="toolbar">
        <label class="btn file">+ เพิ่มเพลงเข้าคิว<input id="cueFiles" type="file" accept="audio/*" multiple></label>
        <button class="btn primary go" id="goBtn">GO</button>
        <button class="btn" id="backBtn">ย้อนคิว</button>
        <button class="btn" id="skipBtn">ข้ามคิว</button>
        <button class="btn danger" id="clearCueBtn">ล้าง</button>
      </div>
      <div class="cue-list" id="cueList"></div>
    </section>

    <section class="card">
      <h2>Sound Pads</h2>
      <div class="toolbar">
        <label class="btn file">นำเข้าเสียง<input id="padFiles" type="file" accept="audio/*" multiple></label>
        <button class="btn" id="clearPadsBtn">ล้าง Pad</button>
      </div>
      <div class="pads" id="pads"></div>
    </section>
  </div>

  <section class="card player">
    <div class="now"><div><div class="now-title" id="nowTitle">ยังไม่มีเพลงกำลังเล่น</div><div class="now-sub" id="nowSub">เลือก Sound Pad หรือกด GO</div></div><div class="time"><span id="cur">00:00</span> / <span id="dur">00:00</span></div></div>
    <input class="progress" id="seek" type="range" min="0" max="1000" value="0">
    <div class="controls">
      <button class="btn primary" id="pauseBtn">พัก / เล่นต่อ</button>
      <button class="btn warn" id="fadeBtn">FADE OUT</button>
      <select class="btn" id="fadeSec"><option value="1">1 วินาที</option><option value="2" selected>2 วินาที</option><option value="3">3 วินาที</option><option value="5">5 วินาที</option><option value="8">8 วินาที</option></select>
      <button class="btn danger" id="stopBtn">STOP ALL</button>
    </div>
    <div class="volume-row"><span>Master Volume</span><input id="volume" type="range" min="0" max="100" value="90"><b id="volumeValue">90%</b></div>
  </section>
  <div class="footer">ไฟล์เสียงถูกเก็บไว้ในแอปและใช้งานได้โดยไม่ต้องต่ออินเทอร์เน็ต • ไม่แนะนำ Bluetooth ในงานสดเพราะอาจมีความหน่วง</div>
</div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='wellsound24_event_player';const STORE='audio';let db;
const state={cues:JSON.parse(localStorage.getItem('ws_cues')||'[]'),pads:JSON.parse(localStorage.getItem('ws_pads')||'[]'),cueIndex:Number(localStorage.getItem('ws_cue_index')||0),current:null,currentId:null,currentType:null,fadeTimer:null};
const $=id=>document.getElementById(id);const cueList=$('cueList'),padsEl=$('pads'),nowTitle=$('nowTitle'),nowSub=$('nowSub'),seek=$('seek');
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function putAudio(id,file){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function getAudio(id){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function delAudio(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function save(){localStorage.setItem('ws_cues',JSON.stringify(state.cues));localStorage.setItem('ws_pads',JSON.stringify(state.pads));localStorage.setItem('ws_cue_index',state.cueIndex)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmt(s){if(!isFinite(s))return'00:00';s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function renderCues(){cueList.innerHTML='';if(!state.cues.length){cueList.innerHTML='<div class="empty">ยังไม่มีคิวเพลง<br>กด “เพิ่มเพลงเข้าคิว”</div>';return}state.cues.forEach((c,i)=>{const e=document.createElement('div');e.className='cue'+(i===state.cueIndex?' active':'')+(i<state.cueIndex?' done':'');e.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="name"></div><div class="sub">${i===state.cueIndex?'คิวถัดไป':'แตะเพื่อเลือกคิว'}</div></div><button class="mini">×</button>`;e.querySelector('.name').textContent=c.name;e.onclick=()=>{state.cueIndex=i;save();renderCues()};e.querySelector('button').onclick=async ev=>{ev.stopPropagation();await delAudio(c.id);state.cues.splice(i,1);if(state.cueIndex>=state.cues.length)state.cueIndex=Math.max(0,state.cues.length-1);save();renderCues()};cueList.appendChild(e)})}
function renderPads(){padsEl.innerHTML='';for(let i=0;i<12;i++){const p=state.pads[i];const b=document.createElement('button');b.className='pad'+(p?'':' empty-pad')+(p&&state.currentId===p.id?' playing':'');if(p){b.innerHTML=`<span class="key">PAD ${i+1}</span><div class="title"></div><div class="meta">แตะเพื่อเล่น • แตะอีกครั้งเพื่อเริ่มใหม่</div>`;b.querySelector('.title').textContent=p.name;b.onclick=()=>playItem(p,'pad')}else{b.innerHTML=`<span class="key">PAD ${i+1}</span><div class="title">ว่าง</div><div class="meta">นำเข้าเสียงเพื่อกำหนดปุ่ม</div>`}padsEl.appendChild(b)}}
async function addFiles(files,target){for(const file of files){const id=uid();await putAudio(id,file);const item={id,name:file.name.replace(/\.[^.]+$/,'')};if(target==='cue')state.cues.push(item);else if(state.pads.length<12)state.pads.push(item);else{await delAudio(id);toast('Sound Pad เต็มแล้ว');break}}save();renderCues();renderPads();toast('นำเข้าเสียงแล้ว')}
function stopCurrent(reset=true){if(state.fadeTimer){clearInterval(state.fadeTimer);state.fadeTimer=null}if(state.current){state.current.pause();if(reset)state.current.currentTime=0;URL.revokeObjectURL(state.current.src)}state.current=null;state.currentId=null;state.currentType=null;nowTitle.textContent='ยังไม่มีเพลงกำลังเล่น';nowSub.textContent='เลือก Sound Pad หรือกด GO';$('cur').textContent='00:00';$('dur').textContent='00:00';seek.value=0;renderPads()}
async function playItem(item,type){try{const blob=await getAudio(item.id);if(!blob){toast('ไม่พบไฟล์เสียง');return}if(state.current)stopCurrent();const url=URL.createObjectURL(blob);const a=new Audio(url);a.volume=Number($('volume').value)/100;state.current=a;state.currentId=item.id;state.currentType=type;nowTitle.textContent=item.name;nowSub.textContent=type==='cue'?'กำลังเล่นจากคิวงาน':'กำลังเล่นจาก Sound Pad';a.ontimeupdate=()=>{if(!a.duration)return;$('cur').textContent=fmt(a.currentTime);$('dur').textContent=fmt(a.duration);seek.value=Math.round(a.currentTime/a.duration*1000)};a.onloadedmetadata=()=>$('dur').textContent=fmt(a.duration);a.onended=()=>{if(type==='cue'){state.cueIndex=Math.min(state.cueIndex+1,state.cues.length);save();renderCues()}stopCurrent(false)};await a.play();renderPads()}catch(e){toast('เปิดเสียงไม่ได้ กรุณาลองไฟล์อื่น')}}
$('cueFiles').onchange=e=>{addFiles([...e.target.files],'cue');e.target.value=''};$('padFiles').onchange=e=>{addFiles([...e.target.files],'pad');e.target.value=''};
$('goBtn').onclick=()=>{if(!state.cues.length)return toast('ยังไม่มีคิวเพลง');if(state.cueIndex>=state.cues.length)state.cueIndex=0;playItem(state.cues[state.cueIndex],'cue')};
$('backBtn').onclick=()=>{state.cueIndex=Math.max(0,state.cueIndex-1);save();renderCues()};$('skipBtn').onclick=()=>{state.cueIndex=Math.min(state.cues.length,state.cueIndex+1);save();renderCues()};
$('pauseBtn').onclick=()=>{if(!state.current)return toast('ยังไม่มีเพลงกำลังเล่น');state.current.paused?state.current.play():state.current.pause()};
$('stopBtn').onclick=()=>stopCurrent();$('fadeBtn').onclick=()=>{if(!state.current)return toast('ยังไม่มีเพลงกำลังเล่น');const a=state.current,steps=30,start=a.volume,ms=Number($('fadeSec').value)*1000;clearInterval(state.fadeTimer);let n=0;state.fadeTimer=setInterval(()=>{n++;a.volume=Math.max(0,start*(1-n/steps));if(n>=steps){clearInterval(state.fadeTimer);state.fadeTimer=null;stopCurrent()}},ms/steps)};
seek.oninput=()=>{if(state.current&&state.current.duration)state.current.currentTime=state.current.duration*Number(seek.value)/1000};$('volume').oninput=e=>{const v=Number(e.target.value);$('volumeValue').textContent=v+'%';if(state.current)state.current.volume=v/100;localStorage.setItem('ws_volume',v)};
$('clearCueBtn').onclick=async()=>{if(!confirm('ล้างคิวงานทั้งหมดหรือไม่?'))return;for(const x of state.cues)await delAudio(x.id);state.cues=[];state.cueIndex=0;save();renderCues();toast('ล้างคิวแล้ว')};
$('clearPadsBtn').onclick=async()=>{if(!confirm('ล้าง Sound Pad ทั้งหมดหรือไม่?'))return;for(const x of state.pads)await delAudio(x.id);state.pads=[];save();renderPads();toast('ล้าง Sound Pad แล้ว')};
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('goBtn').click()}const n=Number(e.key);if(n>=1&&n<=9&&state.pads[n-1])playItem(state.pads[n-1],'pad')});
(async()=>{await openDB();const v=localStorage.getItem('ws_volume')||90;$('volume').value=v;$('volumeValue').textContent=v+'%';renderCues();renderPads()})().catch(()=>toast('ระบบจัดเก็บไฟล์เริ่มทำงานไม่ได้'));
</script>
</body>
</html>
