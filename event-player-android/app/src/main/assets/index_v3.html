<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Wellsound24 Event Player</title><style>:root{--bg:#0b0d12;--panel:#151922;--line:#2a3242;--text:#f7f9fc;--muted:#9aa6b8;--green:#31d7a9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select{font:inherit}.app{max-width:1300px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.top small,.muted{color:var(--muted)}.badge{background:#123b31;color:#75f0cf;padding:7px 10px;border-radius:999px;font-weight:800}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #39445a;background:#171d28;color:#aeb8c9;font-weight:900}.tab.active{background:var(--green);color:#06130f}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}.card{background:linear-gradient(180deg,var(--panel),#11151d);border:1px solid var(--line);border-radius:18px;padding:14px}.btn{border:1px solid #384256;background:#202736;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800}.primary{background:var(--green);color:#06130f;border-color:var(--green)}.danger{background:#3b171b;border-color:#74272e;color:#ffb5ba}.toolbar,.controls,.actions{display:flex;flex-wrap:wrap;gap:8px}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.cue-list{display:flex;flex-direction:column;gap:8px;max-height:35vh;overflow:auto;margin-top:10px}.cue{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#1d2330;border:1px solid var(--line);border-radius:12px;padding:9px}.cue.active{border-color:var(--green)}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad{min-height:110px;border:1px solid #334055;border-radius:15px;color:#fff;text-align:left;padding:12px;background:linear-gradient(145deg,var(--pad,#253047),#111722)}.pad b{display:block;font-size:17px;margin-top:24px}.pad small{opacity:.85}.player{margin-top:14px}.now{display:flex;justify-content:space-between;gap:12px}.progress,.range{width:100%;accent-color:var(--green)}.selector{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.sel{padding:11px 6px;border-radius:11px;border:1px solid #3c4658;background:#1c2330;color:#fff;font-weight:900}.sel.active{background:var(--green);color:#06130f}.settings{max-width:720px;margin:auto}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#b2bdd0}.field input[type=text]{width:100%;background:#202736;color:#fff;border:1px solid #3b465b;border-radius:11px;padding:12px}.switch{display:flex;justify-content:space-between;align-items:center;background:#202736;border:1px solid #3b465b;border-radius:11px;padding:11px}.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.color{height:38px;border-radius:10px;border:3px solid transparent}.color.active{border-color:#fff}.comp{border:1px solid #374157;border-radius:14px;padding:12px;background:#10151e}.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:900;display:none}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.pads{grid-template-columns:repeat(2,1fr)}.selector{grid-template-columns:repeat(4,1fr)}.comp-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div><b>WELLSOUND24</b><br><small>EVENT PLAYER PRO • OFFLINE</small></div><div class="badge">พร้อมใช้งาน</div></div><div class="tabs"><button class="tab active" data-view="player">PLAYER</button><button class="tab" data-view="dash">PAD DASHBOARD</button></div><section id="player" class="view active"><div class="grid"><div class="card"><h3>คิวงาน</h3><div class="toolbar"><label class="btn file">+ เพิ่มเพลง<input id="cueFiles" type="file" accept="audio/*" multiple></label><button class="btn primary" id="go">GO</button><button class="btn" id="back">ย้อน</button><button class="btn" id="skip">ข้าม</button><button class="btn danger" id="clearCue">ล้าง</button></div><div id="cueList" class="cue-list"></div></div><div class="card"><h3>Sound Pads</h3><div id="pads" class="pads"></div></div></div><div class="card player"><div class="now"><div><b id="nowTitle">ยังไม่มีเพลงกำลังเล่น</b><div class="muted" id="nowSub">เลือก Pad หรือกด GO</div></div><div><span id="cur">00:00</span> / <span id="dur">00:00</span></div></div><input id="seek" class="progress" type="range" min="0" max="1000" value="0"><div class="controls"><button class="btn primary" id="pause">พัก / เล่นต่อ</button><button class="btn" id="fade">FADE OUT</button><button class="btn danger" id="stop">STOP ALL</button></div><div class="field"><label>Master Volume <b id="masterText">90%</b></label><input id="master" class="range" type="range" min="0" max="100" value="90"></div></div></section><section id="dash" class="view"><div class="card"><h3>PAD DASHBOARD</h3><div class="muted">เลือก Pad ด้านล่าง แล้วใช้หน้าตั้งค่าชุดเดียวแก้ไข Pad นั้น</div><div id="selector" class="selector"></div><div class="settings"><h2 id="editTitle">ตั้งค่า PAD 1</h2><div class="field"><label>ชื่อปุ่ม</label><input id="pname" type="text" maxlength="40"></div><div class="field"><label>ไฟล์เพลง</label><label class="btn file">เลือก / เปลี่ยนเพลง<input id="pfile" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.aiff,.amr,.3gp,.webm"></label><div id="fileName" class="muted">ยังไม่มีไฟล์</div></div><div class="field"><label>สีปุ่ม</label><div id="colors" class="colors"></div></div><div class="field"><label>วอลุ่ม Pad <b id="volText">100%</b></label><input id="pvol" class="range" type="range" min="0" max="150" value="100"></div><div class="field"><div class="switch"><span>เล่นวน Loop</span><input id="ploop" type="checkbox"></div></div><div class="comp"><div class="switch"><span>Compressor</span><input id="pcomp" type="checkbox"></div><div class="comp-grid"><div class="field"><label>Threshold <b id="thText">-24 dB</b></label><input id="pth" class="range" type="range" min="-60" max="0" value="-24"></div><div class="field"><label>Ratio <b id="ratioText">4:1</b></label><input id="pratio" class="range" type="range" min="1" max="20" value="4"></div><div class="field"><label>Attack <b id="attackText">3 ms</b></label><input id="pattack" class="range" type="range" min="0" max="1000" value="3"></div><div class="field"><label>Release <b id="releaseText">250 ms</b></label><input id="prelease" class="range" type="range" min="10" max="1000" value="250"></div></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="savePad">บันทึก Pad นี้</button><button class="btn danger" id="clearPad">ล้าง Pad นี้</button></div></div></div></section></div><div id="toast" class="toast"></div><script>const COLORS=['#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#16a34a','#0d9488','#0891b2','#475569','#9333ea','#be123c'],DB='wellsound24_event_player',STORE='audio';let db,audioCtx,masterGain,selected=0,pending=null,current={};const $=id=>document.getElementById(id),saved=JSON.parse(localStorage.getItem('ws_pads')||'[]'),state={pads:Array.from({length:12},(_,i)=>saved[i]||null),cues:JSON.parse(localStorage.getItem('ws_cues')||'[]'),cueIndex:+(localStorage.getItem('ws_cue_index')||0)};function norm(p,i){return p?{id:p.id,name:p.name||`PAD ${i+1}`,fileName:p.fileName||'',color:p.color||COLORS[i%COLORS.length],volume:+p.volume||100,loop:!!p.loop,compressor:!!p.compressor,threshold:Number.isFinite(+p.threshold)?+p.threshold:-24,ratio:+p.ratio||4,attack:Number.isFinite(+p.attack)?+p.attack:.003,release:Number.isFinite(+p.release)?+p.release:.25}:null}state.pads=state.pads.map(norm);function save(){localStorage.setItem('ws_pads',JSON.stringify(state.pads));localStorage.setItem('ws_cues',JSON.stringify(state.cues));localStorage.setItem('ws_cue_index',state.cueIndex)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function fmt(s){if(!isFinite(s))return'00:00';s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function put(id,f){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(f,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}function get(id){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function ensure(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=+$('master').value/100;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')await audioCtx.resume()}function renderPads(){const e=$('pads');e.innerHTML='';state.pads.forEach((p,i)=>{const b=document.createElement('button');b.className='pad';b.style.setProperty('--pad',p?.color||'#253047');b.innerHTML=`<small>PAD ${i+1}</small><b>${p?.name||'ว่าง'}</b><small>${p?`VOL ${p.volume}%${p.loop?' • LOOP':''}${p.compressor?' • COMP':''}`:'แตะเพื่อตั้งค่า'}</small>`;b.onclick=()=>p?play(p,'pad'):openDash(i);e.appendChild(b)})}function renderSelector(){const e=$('selector');e.innerHTML='';for(let i=0;i<12;i++){const b=document.createElement('button');b.className='sel'+(i===selected?' active':'');b.textContent='PAD '+(i+1);b.onclick=()=>{selected=i;pending=null;renderSelector();loadEditor()};e.appendChild(b)}}function loadEditor(){const p=state.pads[selected]||{name:`PAD ${selected+1}`,fileName:'',color:COLORS[selected%COLORS.length],volume:100,loop:false,compressor:false,threshold:-24,ratio:4,attack:.003,release:.25};$('editTitle').textContent='ตั้งค่า PAD '+(selected+1);$('pname').value=p.name;$('fileName').textContent=p.fileName||'ยังไม่มีไฟล์';$('pvol').value=p.volume;$('volText').textContent=p.volume+'%';$('ploop').checked=p.loop;$('pcomp').checked=p.compressor;$('pth').value=p.threshold;$('thText').textContent=p.threshold+' dB';$('pratio').value=p.ratio;$('ratioText').textContent=p.ratio+':1';$('pattack').value=Math.round(p.attack*1000);$('attackText').textContent=Math.round(p.attack*1000)+' ms';$('prelease').value=Math.round(p.release*1000);$('releaseText').textContent=Math.round(p.release*1000)+' ms';const c=$('colors');c.innerHTML='';COLORS.forEach(x=>{const b=document.createElement('button');b.className='color'+(x===p.color?' active':'');b.style.background=x;b.dataset.color=x;b.onclick=()=>{c.querySelectorAll('.color').forEach(z=>z.classList.remove('active'));b.classList.add('active')};c.appendChild(b)})}function openDash(i){document.querySelector('[data-view="dash"]').click();selected=i;renderSelector();loadEditor()}function renderCues(){const e=$('cueList');e.innerHTML='';state.cues.forEach((c,i)=>{const r=document.createElement('div');r.className='cue'+(i===state.cueIndex?' active':'');r.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${c.name}</span><button class="btn danger">×</button>`;r.onclick=()=>{state.cueIndex=i;save();renderCues()};r.querySelector('button').onclick=async ev=>{ev.stopPropagation();await del(c.id);state.cues.splice(i,1);save();renderCues()};e.appendChild(r)})}function stop(){if(current.audio)current.audio.pause();if(current.url)URL.revokeObjectURL(current.url);current={};$('nowTitle').textContent='ยังไม่มีเพลงกำลังเล่น';$('nowSub').textContent='เลือก Pad หรือกด GO';$('cur').textContent=$('dur').textContent='00:00';$('seek').value=0}async function play(item,type){try{await ensure();const blob=await get(item.id);if(!blob)return toast('ไม่พบไฟล์');stop();const url=URL.createObjectURL(blob),a=new Audio(url),src=audioCtx.createMediaElementSource(a),gain=audioCtx.createGain();gain.gain.value=(type==='pad'?item.volume:100)/100;let comp=null;if(type==='pad'&&item.compressor){comp=audioCtx.createDynamicsCompressor();comp.threshold.value=item.threshold;comp.ratio.value=item.ratio;comp.attack.value=item.attack;comp.release.value=item.release;src.connect(comp);comp.connect(gain)}else src.connect(gain);gain.connect(masterGain);a.loop=type==='pad'&&item.loop;current={audio:a,gain,url};$('nowTitle').textContent=item.name;$('nowSub').textContent=type==='pad'?`PAD • VOL ${item.volume}%`:'กำลังเล่นจากคิว';a.ontimeupdate=()=>{if(a.duration){$('cur').textContent=fmt(a.currentTime);$('dur').textContent=fmt(a.duration);$('seek').value=Math.round(a.currentTime/a.duration*1000)}};a.onended=()=>{if(type==='cue'){state.cueIndex++;save();renderCues()}stop()};await a.play()}catch(e){toast('เปิดเสียงไม่ได้')}}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.view).classList.add('active');if(t.dataset.view==='dash'){renderSelector();loadEditor()}});$('pfile').onchange=e=>{pending=e.target.files[0]||null;if(pending)$('fileName').textContent=pending.name};$('pvol').oninput=e=>$('volText').textContent=e.target.value+'%';$('pth').oninput=e=>$('thText').textContent=e.target.value+' dB';$('pratio').oninput=e=>$('ratioText').textContent=e.target.value+':1';$('pattack').oninput=e=>$('attackText').textContent=e.target.value+' ms';$('prelease').oninput=e=>$('releaseText').textContent=e.target.value+' ms';$('savePad').onclick=async()=>{const old=state.pads[selected];let id=old?.id;if(pending){if(id)await del(id);id=uid();await put(id,pending)}if(!id)return toast('กรุณาเลือกไฟล์เพลง');state.pads[selected]={id,name:$('pname').value.trim()||pending?.name.replace(/\.[^.]+$/,'')||`PAD ${selected+1}`,fileName:pending?.name||old?.fileName||'',color:$('colors .active')?.dataset.color||COLORS[selected%COLORS.length],volume:+$('pvol').value,loop:$('ploop').checked,compressor:$('pcomp').checked,threshold:+$('pth').value,ratio:+$('pratio').value,attack:+$('pattack').value/1000,release:+$('prelease').value/1000};pending=null;save();renderPads();renderSelector();loadEditor();toast('บันทึก PAD '+(selected+1)+' แล้ว')};$('clearPad').onclick=async()=>{const p=state.pads[selected];if(!p)return;if(confirm('ล้าง PAD นี้หรือไม่?')){await del(p.id);state.pads[selected]=null;save();renderPads();loadEditor()}};$('cueFiles').onchange=async e=>{for(const f of e.target.files){const id=uid();await put(id,f);state.cues.push({id,name:f.name.replace(/\.[^.]+$/,'')})}save();renderCues();e.target.value=''};$('go').onclick=()=>{if(!state.cues.length)return toast('ยังไม่มีคิว');if(state.cueIndex>=state.cues.length)state.cueIndex=0;play(state.cues[state.cueIndex],'cue')};$('back').onclick=()=>{state.cueIndex=Math.max(0,state.cueIndex-1);save();renderCues()};$('skip').onclick=()=>{state.cueIndex=Math.min(state.cues.length,state.cueIndex+1);save();renderCues()};$('clearCue').onclick=async()=>{for(const c of state.cues)await del(c.id);state.cues=[];state.cueIndex=0;save();renderCues()};$('pause').onclick=()=>current.audio&&(current.audio.paused?current.audio.play():current.audio.pause());$('stop').onclick=stop;$('fade').onclick=()=>{if(!current.gain)return;const start=current.gain.gain.value;let n=0;const x=setInterval(()=>{n++;current.gain.gain.value=Math.max(0,start*(1-n/30));if(n>=30){clearInterval(x);stop()}},70)};$('seek').oninput=e=>{if(current.audio&&current.audio.duration)current.audio.currentTime=current.audio.duration*(+e.target.value)/1000};$('master').oninput=e=>{const v=+e.target.value;$('masterText').textContent=v+'%';localStorage.setItem('ws_volume',v);if(masterGain)masterGain.gain.value=v/100};(async()=>{await openDB();const v=localStorage.getItem('ws_volume')||90;$('master').value=v;$('masterText').textContent=v+'%';renderPads();renderSelector();loadEditor();renderCues()})()</script></body></html>
