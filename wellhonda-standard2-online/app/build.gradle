plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wellhonda.obdpro.online'
    compileSdk 35

    defaultConfig {
        applicationId "com.wellhonda.obdpro.standard2.online"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1-online-r6"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
