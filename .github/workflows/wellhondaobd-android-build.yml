name: Build Well Honda OBD Android APK

on:
  push:
    branches:
      - wellhondaobd-android-v1
    paths:
      - 'wellhondaobd-android/**'
      - '.github/workflows/wellhondaobd-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: wellhondaobd-android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp wellhondaobd-android/app/build/outputs/apk/debug/app-debug.apk WellHondaOBD_Android_v1_0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WellHondaOBD_Android_v1_0
          path: WellHondaOBD_Android_v1_0.apk
          if-no-files-found: error
