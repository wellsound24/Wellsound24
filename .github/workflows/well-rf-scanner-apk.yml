name: Build WELL RF Scanner APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'well-rf-scanner-native/**'
      - '.github/workflows/well-rf-scanner-apk.yml'

permissions:
  contents: read

jobs:
  build-and-launch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: well-rf-scanner-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Launch-test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r well-rf-scanner-native/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.well.rfscanner
            adb shell am start -W -n com.well.rfscanner/.MainActivity > /tmp/am_start.txt
            cat /tmp/am_start.txt
            grep -q "Status: ok" /tmp/am_start.txt || grep -q "ThisTime:" /tmp/am_start.txt
            sleep 3
            test -n "$(adb shell pidof com.well.rfscanner | tr -d '\r')"
            ! adb logcat -d | grep -E "FATAL EXCEPTION|Process: com.well.rfscanner"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q "WELL RF SCANNER PRO" /tmp/window.xml
            grep -q "APP START OK" /tmp/window.xml
            echo "ANDROID_LAUNCH_TEST=PASS"

      - name: Save APK
        run: |
          mkdir -p build-artifacts
          cp well-rf-scanner-native/app/build/outputs/apk/debug/app-debug.apk build-artifacts/WELL_RF_Scanner_Pro_v5_LaunchVerified.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WELL_RF_Scanner_Pro_v5_LaunchVerified
          path: build-artifacts/WELL_RF_Scanner_Pro_v5_LaunchVerified.apk
          if-no-files-found: error
