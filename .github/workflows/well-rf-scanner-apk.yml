name: Build WELL RF Scanner APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'well-rf-scanner-v7-clean/**'
      - '.github/workflows/well-rf-scanner-apk.yml'

permissions:
  contents: read

jobs:
  build-v7-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v7 clean APK
        working-directory: well-rf-scanner-v7-clean
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify clean contents
        run: |
          APK=well-rf-scanner-v7-clean/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          if unzip -l "$APK" | grep -q 'device_filter.xml'; then
            echo 'Unexpected old USB resource found'
            exit 1
          fi

      - name: Save v7 APK and ZIP
        run: |
          mkdir -p build-artifacts/v7
          cp well-rf-scanner-v7-clean/app/build/outputs/apk/debug/app-debug.apk build-artifacts/v7/WELL_RF_Scanner_Pro_v7_Clean.apk
          cd build-artifacts/v7
          zip WELL_RF_Scanner_Pro_v7_Clean_APK.zip WELL_RF_Scanner_Pro_v7_Clean.apk

      - name: Upload v7 clean artifact
        uses: actions/upload-artifact@v4
        with:
          name: WELL_RF_Scanner_Pro_v7_Clean
          path: build-artifacts/v7/*
          if-no-files-found: error
