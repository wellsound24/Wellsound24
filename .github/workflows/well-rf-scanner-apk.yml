name: Build WELL RF Scanner APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'well-rf-scanner-v7-clean/**'
      - '.github/workflows/well-rf-scanner-apk.yml'

permissions:
  contents: read

jobs:
  build-v8-real-usb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build v8 real USB APK
        working-directory: well-rf-scanner-v7-clean
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK archive
        run: |
          APK=well-rf-scanner-v7-clean/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Save v8 APK
        run: |
          mkdir -p build-artifacts/v8
          cp well-rf-scanner-v7-clean/app/build/outputs/apk/debug/app-debug.apk build-artifacts/v8/WELL_RF_Scanner_Pro_v8_Real_USB.apk

      - name: Upload v8 APK
        uses: actions/upload-artifact@v4
        with:
          name: WELL_RF_Scanner_Pro_v8_Real_USB
          path: build-artifacts/v8/WELL_RF_Scanner_Pro_v8_Real_USB.apk
          if-no-files-found: error
