name: Build WELL RF Scanner APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'well-rf-scanner-native/**'
      - '.github/workflows/well-rf-scanner-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: well-rf-scanner-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Save APK
        run: |
          mkdir -p build-artifacts
          cp well-rf-scanner-native/app/build/outputs/apk/debug/app-debug.apk build-artifacts/WELL_RF_Scanner_Pro_Native_USB_Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WELL_RF_Scanner_Pro_Native_USB_Test
          path: build-artifacts/WELL_RF_Scanner_Pro_Native_USB_Test.apk
          if-no-files-found: error
