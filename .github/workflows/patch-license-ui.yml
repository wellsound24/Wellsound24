name: Patch License UI

on:
  push:
    branches:
      - well-license-dashboard-new-vercel

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[license-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: well-license-dashboard-new-vercel
      - name: Patch requested License UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""function licenseRows(ls){return ls.map(l=>{const d=daysLeft(l.expires_at),status=l.enabled===false?'<span class=\"badge bad\">ปิด</span>':d!==null&&d<0?'<span class=\"badge bad\">หมดอายุ</span>':d!==null&&d<=7?'<span class=\"badge warn\">ใกล้หมดอายุ</span>':'<span class=\"badge good\">ใช้งาน</span>';return `<tr><td><b>${esc(l.customer_name||'-')}</b><br><span class=\"muted\">${esc(l.license_key||'')}</span></td><td>${esc(l.mt5_login||l.activation_email||'-')}</td><td>${esc(l.broker||l.product_code||'-')}<br><span class=\"muted\">${esc(l.server||'')}</span></td><td>${esc(l.expires_at||'-')}</td><td>${status}</td><td><div class=\"row-actions\"><button class=\"btn small\" onclick='openLicenseModal(${JSON.stringify(l.id)})'>แก้ไข</button><button class=\"btn small ${l.enabled===false?'primary':''}\" onclick='toggleLicense(${JSON.stringify(l.id)},${l.enabled===false})'>${l.enabled===false?'เปิด':'ปิด'}</button></div></td></tr>`}).join('')||'<tr><td colspan=\"6\" class=\"muted\">ไม่มี License ในโปรเจกต์นี้</td></tr>'}"""
          new="""function licenseRows(ls){return ls.map(l=>{const d=daysLeft(l.expires_at),status=l.enabled===false?'<span class=\"badge bad\">ปิด</span>':d!==null&&d<0?'<span class=\"badge bad\">หมดอายุ</span>':d!==null&&d<=7?'<span class=\"badge warn\">ใกล้หมดอายุ</span>':'<span class=\"badge good\">ใช้งาน</span>';return `<tr><td><b>${esc(l.customer_name||'-')}</b><br><span class=\"muted\">${esc(l.license_key||'')}</span></td><td>${esc(l.mt5_login||l.activation_email||'-')}</td><td>${esc(l.broker||l.product_code||'-')}<br><span class=\"muted\">${esc(l.server||'')}</span></td><td>${esc(l.expires_at||'-')}</td><td>${status}</td><td><div class=\"row-actions\"><button class=\"btn small\" onclick='copyLicense(${JSON.stringify(l.id)})'>คัดลอก License</button><button class=\"btn small\" onclick='openLicenseModal(${JSON.stringify(l.id)})'>แก้ไข</button><button class=\"btn small ${l.enabled===false?'primary':''}\" onclick='toggleLicense(${JSON.stringify(l.id)},${l.enabled===false})'>${l.enabled===false?'เปิด':'ปิด'}</button></div></td></tr>`}).join('')||'<tr><td colspan=\"6\" class=\"muted\">ไม่มี License ในโปรเจกต์นี้</td></tr>'}
async function copyLicense(id){const l=licenses.find(x=>x.id===id);if(!l)return;const p=currentProject();const value=p?.product_code==='WELL_AUTO_EQ_PRO'?(l.activation_email||''):(l.license_key||'');if(!value){toast('ไม่มี License ให้คัดลอก');return}try{await navigator.clipboard.writeText(String(value));toast('คัดลอก License แล้ว')}catch{const t=document.createElement('textarea');t.value=String(value);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('คัดลอก License แล้ว')}}"""
          if old not in s:
              raise SystemExit('licenseRows target not found')
          s=s.replace(old,new,1)

          old="""function selectProject(id){currentProjectId=id;localStorage.setItem('well_project',id);renderProjectSelect();renderAll();switchView('dashboard')}"""
          new="""function selectProject(id,keepView=false){const activeView=$('.nav button.active')?.dataset.view||'dashboard';currentProjectId=id;localStorage.setItem('well_project',id);renderProjectSelect();renderAll();switchView(keepView?activeView:'dashboard')}"""
          if old not in s:
              raise SystemExit('selectProject target not found')
          s=s.replace(old,new,1)

          old="""function switchView(name){$$('.view').forEach(x=>x.classList.add('hidden'));$('#view-'+name).classList.remove('hidden');$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===name));const titles={dashboard:'ภาพรวม',licenses:'License',customers:'ลูกค้า',projects:'โปรเจกต์',settings:'ตั้งค่า'};$('#pageTitle').textContent=titles[name]||name}$$('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#projectSelect').onchange=e=>selectProject(e.target.value);$('#newProjectBtn').onclick=newProject;"""
          new="""function switchView(name){$$('.view').forEach(x=>x.classList.add('hidden'));$('#view-'+name).classList.remove('hidden');$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===name));const titles={dashboard:'ภาพรวม',licenses:'License',customers:'ลูกค้า',projects:'โปรเจกต์',settings:'ตั้งค่า'};$('#pageTitle').textContent=titles[name]||name;$('#newProjectBtn')?.classList.toggle('hidden',name==='licenses')}$$('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#projectSelect').onchange=e=>selectProject(e.target.value,true);$('#newProjectBtn').onclick=newProject;"""
          if old not in s:
              raise SystemExit('switchView target not found')
          s=s.replace(old,new,1)

          old="""window.openLicenseModal=openLicenseModal;window.toggleLicense=toggleLicense;"""
          new="""window.openLicenseModal=openLicenseModal;window.copyLicense=copyLicense;window.toggleLicense=toggleLicense;"""
          if old not in s:
              raise SystemExit('window export target not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update License project filtering and copy action [license-ui-patched]"
          git push origin HEAD:well-license-dashboard-new-vercel
