name: Add 32 Channel Overview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-well-assistant-32ch-overview.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch 32-channel UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('well-assistant-pro-android/app/src/main/assets/index.html')
          s=p.read_text()
          if 'WELL_32CH_OVERVIEW_START' in s:
              print('already patched'); raise SystemExit
          css='''<!-- WELL_32CH_OVERVIEW_START --><style id="well32chUI">
          .chOverview{border:1px solid #2a3d4b;background:linear-gradient(155deg,#0d1924,#09121a);border-radius:20px;padding:14px;margin-top:12px}
          .chOverviewHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.chOverviewHead h2{font-size:17px}.chOverviewHead small{font-size:10px;color:#8fa1b2}
          .chAllBtns{display:flex;gap:7px}.chAllBtns button{border:1px solid #345064;background:#10202c;color:#dcebf4;border-radius:11px;padding:9px 11px;font-size:10px;font-weight:800}.chAllBtns button.on{background:#143a2d;border-color:#2f7759;color:#8ce2b4}
          .chGrid32{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chStrip{position:relative;border:1px solid #263846;background:linear-gradient(160deg,#101c28,#0a141d);border-radius:14px;padding:10px;min-height:124px}.chStrip.sel{border-color:#3f87aa;box-shadow:0 0 0 1px #2e6f8e inset}.chTop{display:flex;justify-content:space-between;align-items:start;gap:6px}.chNo{font-weight:900;font-size:13px}.chName{font-size:10px;color:#93a4b4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chAuto{font-size:8px;border:1px solid #335264;border-radius:99px;padding:3px 6px;color:#8fb8cc}.chAuto.on{border-color:#2e7256;color:#79d5a5;background:#102b21}
          .chMeter{height:46px;background:#071018;border:1px solid #1e2c38;border-radius:7px;margin:8px 0;overflow:hidden;display:flex;align-items:end}.chMeterFill{width:100%;height:12%;background:linear-gradient(0deg,#42c985,#44a8d8);transition:height .18s ease}.chDb{font-size:10px;color:#afc1ce}.chFlags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.chFlag{font-size:8px;padding:3px 5px;border-radius:5px;background:#13212c;color:#8fa5b5;border:1px solid #253946}.chFlag.ok{color:#76d9a2;border-color:#2e6c52}.chFlag.warn{color:#f0c27d;border-color:#69502b}.chFlag.bad{color:#f09aa2;border-color:#6f3940}
          .chDetailBar{margin-top:10px;border-top:1px solid #223542;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.chDetailBar b{font-size:12px}.chDetailBar button{border:1px solid #31536a;background:#112635;color:#e9f5fb;border-radius:10px;padding:8px 11px;font-size:10px;font-weight:800}
          @media(min-width:700px){.chGrid32{grid-template-columns:repeat(4,minmax(0,1fr))}.chStrip{min-height:132px}}@media(min-width:980px){.chGrid32{grid-template-columns:repeat(8,minmax(0,1fr))}}
          </style><!-- WELL_32CH_OVERVIEW_END -->'''
          s=s.replace('</head>',css+'</head>')
          html='''<div class="chOverview" id="chOverview"><div class="chOverviewHead"><div><h2>32 Channel Overview</h2><small>All channels stay active. Tap a channel for details.</small></div><div class="chAllBtns"><button id="allAutoBtn" onclick="toggleAllAuto()">AUTO ALL</button><button onclick="openSelectedChannel()">DETAIL</button></div></div><div id="chGrid32" class="chGrid32"></div><div class="chDetailBar"><div><b id="selChTitle">Selected: CH 01</b><small id="selChInfo">Vocal • EQ / Gate / Comp ready</small></div><button onclick="go('channels')">OPEN CHANNEL</button></div></div>'''
          marker='<div class="proActions">'
          if marker in s:
              s=s.replace(marker,html+marker,1)
          else:
              s=s.replace('</section><section id="channels"',html+'</section><section id="channels"',1)
          js='''<script id="well32chJS">
          let selectedOverviewCh=1,allAutoEnabled=false;const channelStates=Array.from({length:32},(_,i)=>({ch:i+1,name:(['Vocal','Kick','Snare','Bass','Guitar','Speech'][i%6]),db:-60+Math.random()*28,auto:true,fb:false}));
          function render32Channels(){let g=document.getElementById('chGrid32');if(!g)return;g.innerHTML='';channelStates.forEach(c=>{let d=document.createElement('button');d.type='button';d.className='chStrip '+(c.ch===selectedOverviewCh?'sel':'');d.onclick=()=>selectOverviewCh(c.ch);let pct=Math.max(4,Math.min(96,(c.db+70)*2));let status=c.db>-12?'warn':'ok';d.innerHTML=`<div class="chTop"><div><div class="chNo">CH ${String(c.ch).padStart(2,'0')}</div><div class="chName">${c.name}</div></div><span class="chAuto ${c.auto?'on':''}">${c.auto?'AUTO':'MAN'}</span></div><div class="chMeter"><div class="chMeterFill" style="height:${pct}%"></div></div><div class="chDb">${c.db.toFixed(1)} dB</div><div class="chFlags"><span class="chFlag ${status}">EQ</span><span class="chFlag ok">GATE</span><span class="chFlag ok">COMP</span><span class="chFlag ${c.fb?'bad':'ok'}">FB</span></div>`;g.appendChild(d)});let c=channelStates[selectedOverviewCh-1];document.getElementById('selChTitle').textContent='Selected: CH '+String(c.ch).padStart(2,'0');document.getElementById('selChInfo').textContent=c.name+' • EQ / Gate / Comp '+(c.auto?'AUTO':'Manual');}
          function selectOverviewCh(n){selectedOverviewCh=n;let ch=document.getElementById('ch');if(ch)ch.value=n;render32Channels()}
          function openSelectedChannel(){let ch=document.getElementById('ch');if(ch)ch.value=selectedOverviewCh;go('channels')}
          function toggleAllAuto(){allAutoEnabled=!allAutoEnabled;channelStates.forEach(c=>c.auto=allAutoEnabled);let b=document.getElementById('allAutoBtn');if(b){b.classList.toggle('on',allAutoEnabled);b.textContent=allAutoEnabled?'AUTO ALL ON':'AUTO ALL'};render32Channels();log('ALL CHANNEL AUTO '+(allAutoEnabled?'ON':'OFF'));toast(allAutoEnabled?'Auto enabled on all 32 channels':'Auto disabled on all channels')}
          function applyAllChannels(){for(let n=1;n<=32;n++){let nn=String(n).padStart(2,'0');if(target==='real'){send('/ch/'+nn+'/eq/on','int',1);send('/ch/'+nn+'/gate/on','int',1);send('/ch/'+nn+'/dyn/on','int',1)}}log('APPLY ALL 32 CHANNELS');toast(target==='real'?'Sent processing enable to 32 channels':'Applied to 32 virtual channels')}
          function animate32Meters(){if(target==='sim'&&simPowered){channelStates.forEach(c=>{c.db+= (Math.random()-.5)*5;c.db=Math.max(-68,Math.min(-8,c.db));if(Math.random()<.004)c.fb=!c.fb});render32Channels()}setTimeout(animate32Meters,700)}
          window.addEventListener('load',()=>{render32Channels();animate32Meters()});
          </script>'''
          s=s.replace('</body>',js+'</body>')
          # make the existing quick apply all-channel aware by adding an ALL CHANNELS button into home if possible
          s=s.replace('APPLY TO M32</button>','APPLY TO M32</button><button onclick="applyAllChannels()">APPLY ALL 32</button>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name wellsound24
          git config user.email wellsound24@gmail.com
          git add well-assistant-pro-android/app/src/main/assets/index.html
          git commit -m 'Add 32-channel overview and all-channel controls' || exit 0
          git push
