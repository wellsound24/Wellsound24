name: Build Well Honda Standard 2 Mobile APK

on:
  push:
    branches:
      - wellhonda-standard2-mobile
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore MainActivity source
        working-directory: wellhonda-standard2-mobile
        run: |
          mkdir -p app/src/main/java/com/wellhonda/obdpro
          base64 -d MainActivity.java.b64 > app/src/main/java/com/wellhonda/obdpro/MainActivity.java

      - name: Build installable APK
        working-directory: wellhonda-standard2-mobile
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare R4 APK
        run: cp wellhonda-standard2-mobile/app/build/outputs/apk/debug/app-debug.apk WellHondaOBD_Standard2_Mobile_R4.apk

      - name: Verify APK package and signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging WellHondaOBD_Standard2_Mobile_R4.apk | tee apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs WellHondaOBD_Standard2_Mobile_R4.apk | tee apk-signature.txt
          grep -q "package: name='com.wellhonda.obdpro.standard2.r3'" apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WellHondaOBD_Standard2_Mobile_R4_APK
          path: WellHondaOBD_Standard2_Mobile_R4.apk
          if-no-files-found: error

      - name: Publish direct-download verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin wellhonda-standard2-mobile-release
          rm -rf /tmp/wellhonda-release
          git worktree add /tmp/wellhonda-release origin/wellhonda-standard2-mobile-release
          mkdir -p /tmp/wellhonda-release/releases
          cp WellHondaOBD_Standard2_Mobile_R4.apk /tmp/wellhonda-release/releases/WellHondaOBD_Standard2_Mobile_R4.apk
          cd /tmp/wellhonda-release
          git add releases/WellHondaOBD_Standard2_Mobile_R4.apk
          git commit -m "Publish verified Standard 2 Mobile R4 APK" || true
          git push origin HEAD:wellhonda-standard2-mobile-release
