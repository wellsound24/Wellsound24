name: Fix Assistant Channel + Auto Detect
on:
  push:
    paths:
      - '.github/workflows/fix-assistant-channel-autodetect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp=Path('well-assistant-pro-android/app/src/main/assets/index.html')
          s=hp.read_text()
          marker='CHANNEL_SETUP_NAV_AUTODETECT_V1'
          if marker not in s:
              addon=r'''<!-- CHANNEL_SETUP_NAV_AUTODETECT_V1 -->
<style id="channelAutoDetectStyle">
#m32AutoDetectBtn{width:100%;margin-top:8px;border:1px solid #2d7ca2;background:#102536;color:#8fdcff;border-radius:12px;padding:11px 12px;font-weight:900;font-size:12px}
#m32AutoDetectBtn.busy{opacity:.65}
</style>
<script id="channelAutoDetectScript">
(function(){
  function openCardSetup(e){
    const card=e.target&&e.target.closest?e.target.closest('.chStrip'):null;
    if(!card)return;
    if(e.target.closest('select,input,.chProcBtn,button:not(.chStrip)'))return;
    e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    let n=parseInt(card.dataset.ch||card.getAttribute('data-ch')||'0');
    if(!n){const cards=[...document.querySelectorAll('.chStrip')];n=cards.indexOf(card)+1;}
    if(typeof openChannelSetup==='function') openChannelSetup(n);
    else if(typeof window.openChannelSetup==='function') window.openChannelSetup(n);
  }
  document.addEventListener('click',openCardSetup,true);
  document.addEventListener('touchend',openCardSetup,true);

  window.autoDetectM32=function(){
    const b=document.getElementById('m32AutoDetectBtn');if(b){b.classList.add('busy');b.textContent='SEARCHING M32R...';b.disabled=true;}
    try{WellNative.autoDetectM32()}catch(e){window.onM32AutoDetect(false,'','Auto detect bridge unavailable')}
  };
  window.onM32AutoDetect=function(ok,ip,msg){
    const b=document.getElementById('m32AutoDetectBtn');if(b){b.classList.remove('busy');b.textContent='AUTO DETECT M32R';b.disabled=false;}
    if(ok&&ip){
      localStorage.ip=ip;
      const q=document.getElementById('m32QuickIp');if(q)q.value=ip;
      const s=document.getElementById('ip');if(s)s.value=ip;
      try{toast('พบ M32R: '+ip)}catch(e){}
      if(typeof connectM32==='function') connectM32();
    }else{
      try{toast(msg||'ไม่พบ M32R ในเครือข่ายนี้')}catch(e){}
    }
  };
  function installButton(){
    const panel=document.getElementById('m32ConnectPanel');
    if(panel&&!document.getElementById('m32AutoDetectBtn')){
      const b=document.createElement('button');b.id='m32AutoDetectBtn';b.textContent='AUTO DETECT M32R';b.onclick=autoDetectM32;
      const form=panel.querySelector('.m32ConnectForm');if(form)form.after(b);else panel.appendChild(b);
    }
  }
  window.addEventListener('load',()=>setTimeout(installButton,300));
  setInterval(installButton,1200);
})();
</script>'''
              s=s.replace('</body>',addon+'</body>')
              hp.write_text(s)

          jp=Path('well-assistant-pro-android/app/src/main/java/com/wellsound/assistantpro/MainActivity.java')
          j=jp.read_text()
          if 'java.net.NetworkInterface' not in j:
              j=j.replace('import java.net.InetAddress;','import java.net.InetAddress;\nimport java.net.Inet4Address;\nimport java.net.NetworkInterface;\nimport java.util.ArrayList;\nimport java.util.Enumeration;\nimport java.util.LinkedHashSet;')
          if '@JavascriptInterface public void autoDetectM32()' not in j:
              anchor='''    @JavascriptInterface public void connectM32(String ip, int port) {'''
              method='''    @JavascriptInterface public void autoDetectM32() {\n      io.execute(() -> {\n        String found = null;\n        try {\n          String saved = null;\n          // Try saved IP first because it is fastest and avoids unnecessary LAN scan.\n          found = probeM32(localStorageIpFallback(), 220) ? localStorageIpFallback() : null;\n          if (found == null) {\n            for (String prefix : localIpv4Prefixes()) {\n              DatagramSocket ds = null;\n              try {\n                ds = new DatagramSocket();\n                ds.setSoTimeout(120);\n                byte[] msg = encodeOsc("/info", "none", "");\n                for (int i = 1; i <= 254; i++) {\n                  try {\n                    InetAddress a = InetAddress.getByName(prefix + i);\n                    ds.send(new DatagramPacket(msg, msg.length, a, 10023));\n                  } catch (Exception ignored) {}\n                }\n                long end = System.currentTimeMillis() + 1800;\n                byte[] buf = new byte[4096];\n                while (System.currentTimeMillis() < end && found == null) {\n                  try {\n                    DatagramPacket p = new DatagramPacket(buf, buf.length);\n                    ds.receive(p);\n                    found = p.getAddress().getHostAddress();\n                  } catch (java.net.SocketTimeoutException timeout) {\n                    break;\n                  } catch (Exception ignored) {}\n                }\n              } finally {\n                if (ds != null) try { ds.close(); } catch (Exception ignored) {}\n              }\n              if (found != null) break;\n            }\n          }\n        } catch (Exception ignored) {}\n        final String f = found;\n        runOnUiThread(() -> webView.evaluateJavascript(\n            "window.onM32AutoDetect&&window.onM32AutoDetect(" + (f != null ? "true" : "false") + "," +\n            (f != null ? "'" + f + "'" : "''") + "," + (f != null ? "'M32R found'" : "'M32R not found'") + ")", null\n        ));\n      });\n    }\n\n    private String localStorageIpFallback() { return "192.168.2.200"; }\n\n    private boolean probeM32(String host, int timeoutMs) {\n      DatagramSocket d = null;\n      try {\n        d = new DatagramSocket();\n        d.setSoTimeout(timeoutMs);\n        byte[] m = encodeOsc("/info", "none", "");\n        d.send(new DatagramPacket(m, m.length, InetAddress.getByName(host), 10023));\n        DatagramPacket p = new DatagramPacket(new byte[4096], 4096);\n        d.receive(p);\n        return p.getAddress().getHostAddress().equals(host);\n      } catch (Exception e) { return false; }\n      finally { if (d != null) try { d.close(); } catch (Exception ignored) {} }\n    }\n\n    private ArrayList<String> localIpv4Prefixes() {\n      LinkedHashSet<String> out = new LinkedHashSet<>();\n      try {\n        Enumeration<NetworkInterface> es = NetworkInterface.getNetworkInterfaces();\n        while (es.hasMoreElements()) {\n          NetworkInterface ni = es.nextElement();\n          if (!ni.isUp() || ni.isLoopback()) continue;\n          Enumeration<InetAddress> as = ni.getInetAddresses();\n          while (as.hasMoreElements()) {\n            InetAddress a = as.nextElement();\n            if (a instanceof Inet4Address && a.isSiteLocalAddress()) {\n              String x = a.getHostAddress(); int k = x.lastIndexOf('.');\n              if (k > 0) out.add(x.substring(0, k + 1));\n            }\n          }\n        }\n      } catch (Exception ignored) {}\n      return new ArrayList<>(out);\n    }\n\n    @JavascriptInterface public void connectM32(String ip, int port) {'''
              if anchor not in j:
                  raise SystemExit('connectM32 anchor not found')
              j=j.replace(anchor,method,1)
              jp.write_text(j)
          PY
      - name: Commit fixes
        run: |
          git config user.name wellsound24
          git config user.email wellsound24@gmail.com
          git add well-assistant-pro-android/app/src/main/assets/index.html well-assistant-pro-android/app/src/main/java/com/wellsound/assistantpro/MainActivity.java
          git diff --cached --quiet || git commit -m 'Fix channel setup tap and add M32R auto detect'
          git push
