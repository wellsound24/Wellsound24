name: Add Channel Source Processing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-well-assistant-channel-processing.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch channel UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('well-assistant-pro-android/app/src/main/assets/index.html');s=p.read_text()
          if 'channelProcessingUI' in s: raise SystemExit(0)
          css='''<style id="channelProcessingUI">.chSource{width:100%;margin-top:6px;background:#09151f;color:#eaf4fa;border:1px solid #304654;border-radius:8px;padding:6px 4px;font-size:10px}.chProcBtn{width:100%;margin-top:6px;border:1px solid #345064;background:#10202c;color:#cfe0e9;border-radius:8px;padding:7px 4px;font-size:9px;font-weight:800}.procModal{position:fixed;inset:0;z-index:100;background:#050b11e8;display:none;align-items:flex-end}.procModal.show{display:flex}.procSheet{width:100%;max-height:88vh;overflow:auto;background:#0c1822;border:1px solid #304553;border-radius:22px 22px 0 0;padding:18px 15px 28px}.procHead{display:flex;justify-content:space-between;align-items:center}.procClose{border:0;background:#172733;color:#fff;border-radius:50%;width:38px;height:38px;font-size:20px}.procItem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px solid #263946;padding:13px 0}.procItem small{color:#8295a5}.procCheck{width:22px;height:22px}.procMode{background:#0a141d;color:#e9f3f8;border:1px solid #304654;border-radius:8px;padding:7px}.displaySetting{margin-top:10px;border:1px solid #2b3e4c;border-radius:14px;padding:12px;background:#0c1822}</style>''';s=s.replace('</head>',css+'</head>')
          js='''<script id="channelProcessingJS">const sourceTypes=['SELECT INPUT TYPE','VOCAL MIC','SPEECH MIC','KICK','SNARE','TOM','HI-HAT','BASS','GUITAR','KEYBOARD','PLAYBACK / DJ','INSTRUMENT','OTHER'];const processors=[['HPF / LOW CUT','Remove unwanted low frequency'],['GATE','Noise and bleed control'],['EQ','Tone and frequency shaping'],['COMPRESSOR','Dynamic control'],['INSERT / FX','Insert processing'],['FEEDBACK GUARD','Feedback protection'],['GAIN ASSIST','Input level assistance']];let displayChannels=parseInt(localStorage.getItem('wellDisplayChannels')||'32'),chCfg=JSON.parse(localStorage.getItem('wellChannelConfig')||'{}');function saveCh(){localStorage.setItem('wellChannelConfig',JSON.stringify(chCfg))}function enhance32(){let g=document.getElementById('chGrid32');if(!g)return;[...g.children].forEach((c,i)=>{let n=i+1;if(!chCfg[n])chCfg[n]={source:'SELECT INPUT TYPE',proc:{}};let q=document.createElement('select');q.className='chSource';sourceTypes.forEach(x=>{let o=new Option(x,x);o.selected=chCfg[n].source===x;q.add(o)});q.onclick=e=>e.stopPropagation();q.onchange=e=>{e.stopPropagation();chCfg[n].source=q.value;saveCh()};let b=document.createElement('button');b.className='chProcBtn';b.textContent='PROCESSING';b.onclick=e=>{e.stopPropagation();openProc(n)};let t=c.querySelector('.chTop')||c.firstElementChild;t.after(q);q.after(b)});applyDisplayCount()}function applyDisplayCount(){let g=document.getElementById('chGrid32');if(g)[...g.children].forEach((c,i)=>c.style.display=i<displayChannels?'':'none');let e=document.getElementById('displayCount');if(e)e.value=displayChannels}function setDisplayCount(v){displayChannels=+v;localStorage.setItem('wellDisplayChannels',v);applyDisplayCount()}function openProc(n){let cfg=chCfg[n];document.getElementById('procTitle').textContent='CH '+String(n).padStart(2,'0')+' — '+cfg.source;let z=document.getElementById('procList');z.innerHTML='';processors.forEach(([name,desc])=>{let x=cfg.proc[name]||{on:false,mode:'AUTO'},r=document.createElement('div');r.className='procItem';r.innerHTML='<div><b>'+name+'</b><small>'+desc+'</small></div><input class="procCheck" type="checkbox" '+(x.on?'checked':'')+'><select class="procMode"><option>AUTO</option><option>MANUAL</option></select>';let ck=r.querySelector('input'),md=r.querySelector('select');md.value=x.mode;function sv(){cfg.proc[name]={on:ck.checked,mode:md.value};saveCh()}ck.onchange=sv;md.onchange=sv;z.appendChild(r)});document.getElementById('procModal').classList.add('show')}function closeProc(){document.getElementById('procModal').classList.remove('show')}function addSettingsDisplay(){let s=document.getElementById('settings');if(!s||document.getElementById('displayCount'))return;let d=document.createElement('div');d.className='displaySetting';d.innerHTML='<b>CHANNEL DISPLAY</b><small>Channels visible on work screen</small><select id="displayCount" onchange="setDisplayCount(this.value)"><option value="8">8 CH</option><option value="16">16 CH</option><option value="24">24 CH</option><option value="32">32 CH</option></select>';s.prepend(d);document.getElementById('displayCount').value=displayChannels}window.addEventListener('load',()=>setTimeout(()=>{enhance32();addSettingsDisplay()},250));</script>''';modal='''<div id="procModal" class="procModal" onclick="if(event.target===this)closeProc()"><div class="procSheet"><div class="procHead"><div><h2 id="procTitle">CHANNEL PROCESSING</h2><small>Choose processing for this input</small></div><button class="procClose" onclick="closeProc()">×</button></div><div id="procList"></div></div></div>''';s=s.replace('</body>',modal+js+'</body>');p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name wellsound24
          git config user.email wellsound24@gmail.com
          git add well-assistant-pro-android/app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Add per-channel source and processing selection'
          git push