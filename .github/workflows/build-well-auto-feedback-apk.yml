name: Build Well Auto EQ Pro APK
on:
  push:
    branches: [ well-auto-feedback-apk ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: well-auto-feedback-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Disable feedback controls in Flat EQ
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java')
          s=p.read_text()
          needle='displayMode.setOnItemSelectedListener(L(v->{analyzer.mode=displayMode.getSelectedItemPosition();analyzer.invalidate();}));'
          repl='operation.setOnItemSelectedListener(L(v->{updateModeControls();}));'+needle
          if 'operation.setOnItemSelectedListener(L(v->{updateModeControls();}));' not in s:
              if needle not in s: raise SystemExit('display listener marker not found')
              s=s.replace(needle,repl,1)
          marker='interface A{void go(View v);}'
          method='void updateModeControls(){boolean feedback=operation!=null&&operation.getSelectedItemPosition()==0;if(delayMs!=null){delayMs.setEnabled(feedback);delayMs.setAlpha(feedback?1.0f:0.35f);}if(recutDelayMs!=null){recutDelayMs.setEnabled(feedback);recutDelayMs.setAlpha(feedback?1.0f:0.35f);}if(cutDb!=null){cutDb.setEnabled(feedback);cutDb.setAlpha(feedback?1.0f:0.35f);}}\n '
          if 'void updateModeControls()' not in s:
              if marker not in s: raise SystemExit('interface marker not found')
              s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Save source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java
          if git diff --cached --quiet; then echo 'Source already updated'; else git commit -m 'Disable feedback-only settings in Flat EQ [skip ci]'; git push origin HEAD:well-auto-feedback-apk; fi
      - name: Build debug APK
        working-directory: well-auto-feedback-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp well-auto-feedback-android/app/build/outputs/apk/debug/app-debug.apk Well_Auto_EQ_Pro_v1.0_License.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Well_Auto_EQ_Pro_v1.0_License
          path: Well_Auto_EQ_Pro_v1.0_License.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        run: |
          mkdir -p downloads
          cp Well_Auto_EQ_Pro_v1.0_License.apk downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          if git diff --cached --quiet; then echo 'APK unchanged'; else git commit -m 'Publish Well Auto EQ Pro v1.0 Flat EQ control fix [skip ci]'; git push origin HEAD:well-auto-feedback-apk; fi
