name: Build Well Auto EQ Pro APK
on:
  push:
    branches: [ well-auto-feedback-apk ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: well-auto-feedback-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply CUT EACH TIME default -3 dB
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java')
          s=p.read_text()
          old='cutDb=sp(new String[]{"-1 dB","-2 dB","-3 dB","-4 dB","-5 dB","-6 dB"},1);'
          new='cutDb=sp(new String[]{"-1 dB","-2 dB","-3 dB","-4 dB","-5 dB","-6 dB"},2);'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('CUT EACH TIME default target not found')
          p.write_text(s)
          PY
      - name: Save source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java
          if git diff --cached --quiet; then echo 'CUT EACH TIME already -3 dB'; else git commit -m 'Set CUT EACH TIME default to -3 dB [skip ci]'; git push origin HEAD:well-auto-feedback-apk; fi
      - name: Build debug APK
        working-directory: well-auto-feedback-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp well-auto-feedback-android/app/build/outputs/apk/debug/app-debug.apk Well_Auto_EQ_Pro_v1.0_License.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Well_Auto_EQ_Pro_v1.0_License
          path: Well_Auto_EQ_Pro_v1.0_License.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        run: |
          mkdir -p downloads
          cp Well_Auto_EQ_Pro_v1.0_License.apk downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          if git diff --cached --quiet; then echo 'APK unchanged'; else git commit -m 'Publish Well Auto EQ Pro v1.0 CUT -3 dB [skip ci]'; git push origin HEAD:well-auto-feedback-apk; fi
