name: Build Well Auto EQ Pro APK
on:
  push:
    branches: [ well-auto-feedback-apk ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: well-auto-feedback-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply smooth defaults and control fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java')
          s=p.read_text()

          # Defaults from the user's tested smooth setup.
          s=s.replace('delayMs=sp(new String[]{"1 ms","25 ms","50 ms","100 ms","150 ms","250 ms","500 ms","1000 ms"},2);',
                      'delayMs=sp(new String[]{"1 ms","25 ms","50 ms","100 ms","150 ms","250 ms","500 ms","1000 ms"},0);',1)
          s=s.replace('recutDelayMs=sp(new String[]{"100 ms","150 ms","200 ms","250 ms","300 ms","500 ms","800 ms","1000 ms","1500 ms","2000 ms"},3);',
                      'recutDelayMs=sp(new String[]{"100 ms","150 ms","200 ms","250 ms","300 ms","500 ms","800 ms","1000 ms","1500 ms","2000 ms"},5);',1)
          s=s.replace('cutDb=sp(new String[]{"-1 dB","-2 dB","-3 dB","-4 dB","-5 dB","-6 dB"},2);',
                      'cutDb=sp(new String[]{"-1 dB","-2 dB","-3 dB","-4 dB","-5 dB","-6 dB"},1);',1)

          # Button references and active-color feedback.
          old='Button u=btn("UNDO LAST GEQ CHANGE"),rst=btn("RESTORE ORIGINAL GEQ");r.addView(u,lp());r.addView(rst,lp());log=tv("READY",12,false);'
          new='Button u=btn("UNDO LAST GEQ CHANGE"),rst=btn("RESTORE ORIGINAL GEQ");r.addView(u,lp());r.addView(rst,lp());log=tv("READY",12,false);'
          if old not in s:
              raise SystemExit('button block not found')
          s=s.replace(old,new,1)

          s=s.replace('startStop.setOnClickListener(v->{if(engineRunning)stopEngine();else startEngine();});u.setOnClickListener(v->undo());rst.setOnClickListener(v->restore());',
                      'startStop.setOnClickListener(v->{if(engineRunning)stopEngine();else startEngine();});u.setOnClickListener(v->{undo();pulseButton(u,Color.rgb(34,197,94));});rst.setOnClickListener(v->{restore();pulseButton(rst,Color.rgb(245,158,11));});',1)

          s=s.replace('startStop.setText("■ STOP REALTIME");runState.setText("RUNNING • "+targetName()+" ↔ FX"+fx()+"-"+side.getSelectedItem());}void stopEngine(){engineRunning=false;if(startStop!=null){startStop.setText("▶ START REALTIME");runState.setText("ENGINE: STOPPED");}}',
                      'startStop.setText("■ STOP REALTIME");startStop.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(220,38,38)));runState.setText("RUNNING • "+targetName()+" ↔ FX"+fx()+"-"+side.getSelectedItem());}void stopEngine(){engineRunning=false;if(startStop!=null){startStop.setText("▶ START REALTIME");startStop.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(82,82,91)));runState.setText("ENGINE: STOPPED");}}',1)

          # Fix UNDO / RESTORE so they do not clear the snapshot/undo state by calling readGeq().
          old_undo='void undo(){if(undo.isEmpty())return;HashMap<Integer,Float> m=undo.pop();for(Map.Entry<Integer,Float> e:m.entrySet())send(pa(e.getKey()),e.getValue());cur.clear();cur.putAll(m);readGeq();}void restore(){for(Map.Entry<Integer,Float> e:snap.entrySet())send(pa(e.getKey()),e.getValue());readGeq();}'
          new_undo='void undo(){if(undo.isEmpty()){toast("ไม่มี GEQ change ให้ Undo");return;}HashMap<Integer,Float> m=undo.pop();for(Map.Entry<Integer,Float> e:m.entrySet())send(pa(e.getKey()),e.getValue());cur.clear();cur.putAll(m);for(int i=0;i<31;i++){Float v=m.get(par(i));if(v!=null)geq[i]=den(v);}analyzer.setGeq(geq);candidate.setText("UNDO: restored previous GEQ step");}void restore(){if(snap.isEmpty()){toast("ยังไม่มี Original EQ snapshot");return;}for(Map.Entry<Integer,Float> e:snap.entrySet())send(pa(e.getKey()),e.getValue());cur.clear();cur.putAll(snap);for(int i=0;i<31;i++){Float v=snap.get(par(i));if(v!=null)geq[i]=den(v);}undo.clear();analyzer.setGeq(geq);candidate.setText("RESTORED: ORIGINAL EQ");}'
          if old_undo not in s:
              raise SystemExit('undo/restore block not found')
          s=s.replace(old_undo,new_undo,1)

          # Brief visible confirmation on action buttons.
          marker='void toast(String s){Toast.makeText(this,s,Toast.LENGTH_SHORT).show();}'
          repl='void pulseButton(Button b,int c){if(b==null)return;b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(c));new Handler(getMainLooper()).postDelayed(()->b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(82,82,91))),450);}void toast(String s){Toast.makeText(this,s,Toast.LENGTH_SHORT).show();}'
          if marker not in s:
              raise SystemExit('toast marker not found')
          s=s.replace(marker,repl,1)

          p.write_text(s)
          PY
      - name: Save source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add well-auto-feedback-android/app/src/main/java/com/wellsound/autofeedback/MainActivity.java
          if git diff --cached --quiet; then
            echo 'Source already up to date'
          else
            git commit -m 'Smooth defaults and working realtime undo restore controls [skip ci]'
            git push origin HEAD:well-auto-feedback-apk
          fi
      - name: Build debug APK
        working-directory: well-auto-feedback-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp well-auto-feedback-android/app/build/outputs/apk/debug/app-debug.apk Well_Auto_EQ_Pro_v1.0_License.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Well_Auto_EQ_Pro_v1.0_License
          path: Well_Auto_EQ_Pro_v1.0_License.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        run: |
          mkdir -p downloads
          cp Well_Auto_EQ_Pro_v1.0_License.apk downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Well_Auto_EQ_Pro_v1.0_License.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
          else
            git commit -m 'Publish Well Auto EQ Pro v1.0 smooth controls build [skip ci]'
            git push origin HEAD:well-auto-feedback-apk
          fi
