<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wellsound Dashboard</title>
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body class="dashboard">
    <main class="dashboard-shell">
      <section class="editor-panel">
        <p class="eyebrow">Wellsound CMS</p>
        <h1>Dashboard แก้ไขหน้าเว็บไซต์</h1>
        <p class="status" id="status">กำลังโหลดข้อมูล...</p>

        <form id="editor"></form>

        <div class="toolbar">
          <button class="small-button primary" type="button" id="saveLocal">บันทึกและดูตัวอย่าง</button>
          <button class="small-button" type="button" id="publishGithub">บันทึกลง GitHub</button>
          <button class="small-button" type="button" id="downloadJson">ดาวน์โหลด data.json</button>
          <a class="small-button" href="../">กลับหน้าเว็บ</a>
        </div>
      </section>

      <section class="preview-panel" aria-label="Website preview">
        <iframe class="preview-frame" id="preview" src="../index.html" title="Wellsound preview"></iframe>
      </section>
    </main>

    <script src="../assets/admin.js"></script>
  </body>
</html>
