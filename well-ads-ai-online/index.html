<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Well Ads AI</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#0b0b0b}body{overflow:hidden}#app{position:fixed;inset:0}</style></head><body><iframe id="app" src="/api/wellads-source" allow="clipboard-read; clipboard-write"></iframe><script>
(()=>{
 const frame=document.getElementById('app'),KEY='wellads_professional_history_v3';
 const norm=v=>String(v||'').replace(/\s+/g,' ').trim();
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 function install(){
  let d;try{d=frame.contentDocument}catch(e){return} if(!d||!d.body||d.__welladsPatched)return;
  if((d.body.innerText||'').trim()==='PLACEHOLDER')return;
  d.__welladsPatched=true;
  function labelOf(el){let s='';if(el.id){const l=d.querySelector('label[for="'+CSS.escape(el.id)+'"]');if(l)s+=' '+l.innerText}if(el.closest('label'))s+=' '+el.closest('label').innerText;if(el.parentElement)s+=' '+el.parentElement.innerText.slice(0,180);return norm(s+' '+(el.placeholder||'')+' '+(el.name||'')+' '+(el.id||''))}
  function fields(){return [...d.querySelectorAll('input,textarea,select')].map(el=>({el,label:labelOf(el),value:norm(el.value)})).filter(x=>x.value)}
  function val(rx){const x=fields().find(x=>rx.test(x.label));return x?x.value:''}
  function target(){let best=null,score=-999;for(const el of d.querySelectorAll('textarea,[contenteditable="true"],input[type="text"]')){const t=labelOf(el).toLowerCase();let s=0;if(/ข้อความโพสต์|โพสต์งาน|แคปชั่น|caption/.test(t))s+=60;if(/โพสต์|ข้อความ|post/.test(t))s+=20;if(el.tagName==='TEXTAREA')s+=10;if(/url|ค้นหา|search|เบอร์|โทร|line|เว็บไซต์/.test(t))s-=40;if(s>score){score=s;best=el}}return best}
  function setv(el,v){if(!el)return;if(el.isContentEditable){el.textContent=v;el.dispatchEvent(new InputEvent('input',{bubbles:true,data:v,inputType:'insertText'}));return}const p=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;const st=Object.getOwnPropertyDescriptor(p,'value')?.set;st?st.call(el,v):el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
  function post(){
   const job=val(/ประเภทงาน|ชื่องาน|งานที่ไปทำ|ลักษณะงาน|ประเภทบริการ/i);
   const loc=val(/สถานที่|พื้นที่|จังหวัด|อำเภอ|location|โลเคชั่น/i);
   const service=val(/รายละเอียดงาน|บริการที่ให้|สิ่งที่ทำ|รายละเอียดบริการ|อุปกรณ์|ระบบเสียง|ระบบแสง|เวที/i);
   const customer=val(/ชื่อลูกค้า|ลูกค้า|บริษัท|หน่วยงาน/i);
   const j=job||'งานที่ได้รับมอบหมาย',w=loc?' ที่ '+loc:'',sv=service||'ดูแลหน้างานตามรายละเอียดที่ลูกค้ามอบหมาย',cu=customer||'ลูกค้า';
   const l1=['อีกหนึ่งผลงานที่ทีม Wellsound24 ได้รับความไว้วางใจให้ดูแล '+j+w,'ส่งมอบอีกหนึ่งงานเรียบร้อย | '+j+w,'อีกหนึ่งงานที่ทีม Wellsound24 ได้ร่วมดูแล | '+j+w,'อีกหนึ่งความไว้วางใจที่มอบให้ Wellsound24 | '+j+w,'Wellsound24 ดูแลงานอีกหนึ่งงานเรียบร้อย | '+j+w];
   const l2=['งานนี้ทีมงานดูแล '+sv+' พร้อมตรวจสอบความพร้อมและความเรียบร้อยตลอดงาน','Wellsound24 รับผิดชอบ '+sv+' โดยดูแลรายละเอียดตั้งแต่การเตรียมงานจนถึงการใช้งานจริง','สำหรับงานนี้ทีมของเราดูแล '+sv+' ให้เหมาะสมกับรูปแบบและพื้นที่ของงาน','ทีมงานดำเนินงานในส่วน '+sv+' พร้อมดูแลและประสานงานตลอดช่วงงาน'];
   const l3=['ขอขอบพระคุณ'+(customer?' '+cu:'ลูกค้า')+' ที่ไว้วางใจให้ Wellsound24 ได้ดูแลงานในครั้งนี้ครับ','ขอบพระคุณ'+(customer?' '+cu:'ลูกค้า')+' สำหรับความไว้วางใจที่มอบให้ทีม Wellsound24 ครับ','Wellsound24 ขอขอบพระคุณ'+(customer?' '+cu:'ลูกค้า')+' ที่เลือกใช้บริการและไว้วางใจทีมงานของเราครับ','ขอขอบพระคุณ'+(customer?' '+cu:'ลูกค้า')+' ที่มอบหมายให้ Wellsound24 เป็นส่วนหนึ่งในการดูแลงานครั้งนี้ครับ'];
   let h=[];try{h=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}let out='';for(let i=0;i<50;i++){out=pick(l1)+'\n\n'+pick(l2)+'\n\n'+pick(l3);if(!h.includes(out)&&!out.includes('มีเรื่องดีๆ มาแชร์'))break}h.unshift(out);h=[...new Set(h)].slice(0,50);try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}return out
  }
  d.addEventListener('click',e=>{const b=e.target.closest?.('button,[role="button"]');if(!b)return;const t=norm(b.innerText||b.textContent).toLowerCase();const isGen=(/ai/.test(t)&&/เขียนใหม่|เจน|สร้าง|โพสต์|ข้อความ/.test(t))||/เจนข้อความ|สร้างข้อความ|เขียนใหม่จากผลวิเคราะห์/.test(t);if(!isGen)return;const ta=target();if(!ta)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();setv(ta,post())},true)
 }
 frame.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,1200)});setInterval(install,1500)
})();
</script></body></html>
