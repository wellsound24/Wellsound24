<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Well Ads AI</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0b}
    #boot{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;padding:24px}
  </style>
</head>
<body>
<div id="boot">กำลังเปิด Well Ads AI...</div>
<script>
(async()=>{
  const SOURCE='https://well-ads-ctmjmbdhw-wellsound25.vercel.app';
  const res=await fetch(SOURCE,{cache:'no-store'});
  if(!res.ok) throw new Error('โหลดโปรแกรมเดิมไม่สำเร็จ');
  const shell=await res.text();
  const m=shell.match(/atob\(\"([A-Za-z0-9+/=]+)\"\)/);
  if(!m) throw new Error('ไม่พบข้อมูลโปรแกรมเดิม');
  const b=atob(m[1]);
  const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const inner=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();

  const patch=`<script>
  (()=>{
    const HISTORY_KEY='wellads_professional_post_history_v1';
    const banned=['มีเรื่องดีๆ มาแชร์'];

    function norm(v){return String(v||'').replace(/\\s+/g,' ').trim()}
    function labelOf(el){
      let s='';
      if(el.id){ const l=document.querySelector('label[for="'+CSS.escape(el.id)+'"]'); if(l) s+=' '+l.innerText; }
      if(el.closest('label')) s+=' '+el.closest('label').innerText;
      const p=el.parentElement; if(p) s+=' '+p.innerText.slice(0,180);
      s+=' '+(el.getAttribute('placeholder')||'')+' '+(el.getAttribute('name')||'')+' '+(el.id||'');
      return norm(s);
    }
    function allFields(){
      return [...document.querySelectorAll('input,select,textarea')].map(el=>({el,label:labelOf(el),value:norm(el.value)})).filter(x=>x.value);
    }
    function findValue(rx){
      const f=allFields().filter(x=>rx.test(x.label));
      return f.length?f[0].value:'';
    }
    function findTarget(){
      const c=[...document.querySelectorAll('textarea,[contenteditable="true"],input[type="text"]')];
      let best=null,score=-999;
      for(const el of c){
        const t=(labelOf(el)+' '+(el.getAttribute('placeholder')||'')).toLowerCase();
        let s=0;
        if(/ข้อความโพสต์|โพสต์งาน|แคปชั่น|caption|ข้อความโฆษณา/.test(t)) s+=50;
        if(/โพสต์|post|ข้อความ/.test(t)) s+=20;
        if(el.tagName==='TEXTAREA') s+=10;
        if(/ค้นหา|search|ชื่อเพจ|เบอร์|โทร|url|เว็บไซต์|line/.test(t)) s-=30;
        if(s>score){score=s;best=el;}
      }
      return best;
    }
    function setNativeValue(el,value){
      if(!el) return;
      if(el.isContentEditable){
        el.focus(); el.textContent=value;
        el.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:value}));
        el.dispatchEvent(new Event('change',{bubbles:true}));
        return;
      }
      const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;
      const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;
      if(setter) setter.call(el,value); else el.value=value;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      el.dispatchEvent(new Event('change',{bubbles:true}));
      el.focus();
    }
    function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
    function cleanPiece(v){return norm(v).replace(/[|•]+$/,'').trim()}
    function buildPost(){
      const job=cleanPiece(findValue(/ประเภทงาน|ชื่องาน|ชื่องานที่ไปทำ|ประเภทบริการ|งานที่ไปทำ|ลักษณะงาน/i));
      const location=cleanPiece(findValue(/สถานที่|พื้นที่|จังหวัด|อำเภอ|โลเคชั่น|location/i));
      const service=cleanPiece(findValue(/รายละเอียดงาน|บริการที่ให้|สิ่งที่ทำ|รายละเอียดบริการ|อุปกรณ์|ระบบเสียง|ระบบแสง|เวที/i));
      const customer=cleanPiece(findValue(/ชื่อลูกค้า|ลูกค้า|บริษัท|หน่วยงาน/i));

      const jobPhrase=job?job:'งานที่ได้รับมอบหมาย';
      const where=location?' ณ '+location:'';
      const servicePhrase=service?service:'ดูแลหน้างานตามรายละเอียดที่ลูกค้ามอบหมาย';
      const customerPhrase=customer?'คุณ '+customer:'ลูกค้า';

      const line1s=[
        'อีกหนึ่งผลงานที่ทีม Wellsound24 ได้รับความไว้วางใจให้ดูแล '+jobPhrase+where,
        'ส่งมอบอีกหนึ่งงานอย่างเรียบร้อย | '+jobPhrase+where,
        'เก็บภาพอีกหนึ่งผลงานจากทีม Wellsound24 กับ '+jobPhrase+where,
        'Wellsound24 พร้อมดูแลอีกหนึ่งงานสำคัญ | '+jobPhrase+where,
        'อีกหนึ่งงานที่เราใส่ใจในทุกรายละเอียด | '+jobPhrase+where,
        'เบื้องหลังอีกหนึ่งงานคุณภาพจากทีม Wellsound24 | '+jobPhrase+where,
        'จบงานเรียบร้อยอีกหนึ่งโปรเจกต์ | '+jobPhrase+where,
        'อีกหนึ่งความไว้วางใจที่ Wellsound24 ได้รับ | '+jobPhrase+where
      ];
      const line2s=[
        'ทีมงานดูแล '+servicePhrase+' พร้อมประสานงานและควบคุมรายละเอียดตลอดงานอย่างเป็นระบบ',
        'Wellsound24 รับผิดชอบ '+servicePhrase+' โดยทีมงานดูแลทุกขั้นตอนให้การทำงานเป็นไปอย่างราบรื่น',
        'สำหรับงานนี้ทีมของเราดูแล '+servicePhrase+' พร้อมตรวจสอบความพร้อมในแต่ละขั้นตอนอย่างละเอียด',
        'เราใส่ใจตั้งแต่การเตรียมงานจนถึงหน้างาน โดยดูแล '+servicePhrase+' ให้เหมาะสมกับรูปแบบของงาน',
        'ทีมงานดำเนินงานในส่วน '+servicePhrase+' พร้อมดูแลความเรียบร้อยและการประสานงานตลอดช่วงงาน',
        'รายละเอียดของงานครั้งนี้คือ '+servicePhrase+' โดยเน้นความพร้อม ความเรียบร้อย และมาตรฐานการทำงานของทีม'
      ];
      const line3s=[
        'ขอขอบพระคุณ'+customerPhrase+'ที่ไว้วางใจให้ Wellsound24 ได้เป็นส่วนหนึ่งในการดูแลงานครั้งนี้ครับ',
        'ขอบพระคุณ'+customerPhrase+'สำหรับความไว้วางใจที่มอบให้ทีม Wellsound24 ในงานครั้งนี้ครับ',
        'Wellsound24 ขอขอบพระคุณ'+customerPhrase+'ที่เลือกใช้บริการและมอบความไว้วางใจให้ทีมงานของเราครับ',
        'ขอขอบพระคุณ'+customerPhrase+'ที่ให้โอกาสทีม Wellsound24 ได้ดูแลรายละเอียดของงานในครั้งนี้ครับ',
        'ขอบคุณสำหรับความไว้วางใจที่มีให้ Wellsound24 เสมอมา เรายินดีที่ได้ร่วมดูแลงานครั้งนี้ครับ',
        'ขอขอบพระคุณที่ไว้วางใจทีม Wellsound24 ให้ร่วมเป็นส่วนหนึ่งของความสำเร็จในงานครั้งนี้ครับ'
      ];

      let history=[]; try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){}
      let out='';
      for(let i=0;i<60;i++){
        out=pick(line1s)+'\\n\\n'+pick(line2s)+'\\n\\n'+pick(line3s);
        if(!history.includes(out) && !banned.some(x=>out.includes(x))) break;
      }
      history.unshift(out); history=[...new Set(history)].slice(0,40);
      try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){}
      return out;
    }
    function isGenerateButton(btn){
      const t=norm(btn.innerText||btn.textContent).toLowerCase();
      return (/เจน|generate|สร้าง/.test(t) && /ข้อความ|โพสต์|caption|ai/.test(t)) || /ai.*โพสต์|ai.*ข้อความ|เจนข้อความ/.test(t);
    }
    function toast(msg){
      const old=document.getElementById('wellads-toast'); if(old) old.remove();
      const d=document.createElement('div'); d.id='wellads-toast'; d.textContent=msg;
      Object.assign(d.style,{position:'fixed',right:'18px',bottom:'18px',zIndex:'2147483647',background:'#111',color:'#fff',border:'1px solid #444',padding:'10px 14px',borderRadius:'10px',fontFamily:'system-ui,sans-serif',fontSize:'14px',boxShadow:'0 8px 24px rgba(0,0,0,.35)'});
      document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
    }
    document.addEventListener('click',e=>{
      const btn=e.target.closest?.('button,[role="button"]');
      if(!btn || !isGenerateButton(btn)) return;
      const target=findTarget();
      if(!target) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      setNativeValue(target,buildPost());
      toast('สร้างข้อความโพสต์ใหม่แล้ว');
    },true);
  })();
  <\/script>`;

  let finalHtml=inner;
  if(/<\/body>/i.test(finalHtml)) finalHtml=finalHtml.replace(/<\/body>/i,patch+'</body>');
  else finalHtml+=patch;
  document.open(); document.write(finalHtml); document.close();
})().catch(err=>{
  document.body.innerHTML='<pre style="white-space:pre-wrap;color:#fff;background:#111;padding:24px;font-family:system-ui">เปิดโปรแกรมไม่สำเร็จ: '+String(err.message||err)+'</pre>';
});
</script>
</body>
</html>
