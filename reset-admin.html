<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d14"><title>เปลี่ยน Password Admin</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#13243c 0,#080d14 46%,#05090f 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);background:#0f1a2a;border:1px solid #273a54;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.38)}h1{font-size:22px;margin:0 0 7px}.sub{color:#9dadc1;font-size:13px;line-height:1.5;margin-bottom:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#c8d3e1;margin-bottom:6px}.input{width:100%;min-height:46px;border:1px solid #2c405b;border-radius:11px;background:#0b1421;color:#fff;padding:10px 12px;font-size:15px}.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:#25dba6;color:#06120f;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.55}.msg{min-height:22px;font-size:12px;color:#a9b8ca;margin-top:12px;line-height:1.5}.ok{color:#55dfb4}.bad{color:#ff8585}.back{display:block;text-align:center;margin-top:14px;color:#8fcfff;text-decoration:none;font-size:12px}</style>
</head>
<body><main class="card"><h1>ตั้ง Password Admin ใหม่</h1><div class="sub">ลิงก์นี้ใช้สำหรับกู้คืน Password ของ Well License Dashboard และมีเวลาจำกัด</div><div id="form"><div class="field"><label>Password ใหม่</label><input id="p1" class="input" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>ยืนยัน Password ใหม่</label><input id="p2" class="input" type="password" autocomplete="new-password" minlength="8"></div><button id="save" class="btn" type="button">บันทึก Password ใหม่</button></div><div id="msg" class="msg"></div><a class="back" href="/well6">กลับไปหน้า Login</a></main>
<script>
const API='https://sjcxywxixgrpdgeqaepk.supabase.co/functions/v1/admin-password-recovery';
const hash=new URLSearchParams(location.hash.slice(1));
const access=hash.get('access_token')||'';
const msg=document.getElementById('msg'),btn=document.getElementById('save');
if(!access){msg.innerHTML='<span class="bad">ลิงก์ไม่ถูกต้องหรือหมดอายุ กรุณากด “ลืม Password?” ใหม่อีกครั้ง</span>';btn.disabled=true}
btn.addEventListener('click',async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8){msg.innerHTML='<span class="bad">Password ต้องมีอย่างน้อย 8 ตัวอักษร</span>';return}if(a!==b){msg.innerHTML='<span class="bad">ยืนยัน Password ไม่ตรงกัน</span>';return}btn.disabled=true;msg.textContent='กำลังบันทึก...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'complete',access_token:access,password:a})});const j=await r.json().catch(()=>({ok:false,error:'server_error'}));if(!r.ok||!j.ok)throw new Error(j.error||'server_error');document.getElementById('form').style.display='none';msg.innerHTML='<span class="ok">เปลี่ยน Password สำเร็จแล้ว สามารถกลับไป Login ด้วย Password ใหม่ได้ทันที</span>';history.replaceState(null,'',location.pathname)}catch(e){const map={reset_link_expired:'ลิงก์หมดอายุ กรุณาขอลิงก์ใหม่',reset_link_used:'ลิงก์นี้ถูกใช้ไปแล้ว กรุณาขอลิงก์ใหม่',invalid_reset_link:'ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์ใหม่',password_too_short:'Password ต้องมีอย่างน้อย 8 ตัวอักษร'};msg.innerHTML='<span class="bad">'+(map[e.message]||'เปลี่ยน Password ไม่สำเร็จ กรุณาลองใหม่')+'</span>';btn.disabled=false}});
</script></body></html>
