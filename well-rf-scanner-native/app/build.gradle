plugins {
    id 'com.android.application'
}

android {
    namespace 'com.well.rfscanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.well.rfscanner'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3-native-usb-safe-launch'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
