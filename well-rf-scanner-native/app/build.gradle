plugins {
    id 'com.android.application'
}

android {
    namespace 'com.well.rfscanner.clean'
    compileSdk 35

    defaultConfig {
        applicationId 'com.well.rfscanner.clean'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6-clean-base'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
