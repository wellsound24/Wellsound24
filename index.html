<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Well License Dashboard</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0f14;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);background:#111827;border:1px solid #263244;border-radius:18px;padding:22px;box-sizing:border-box}
    .row{display:flex;align-items:center;gap:12px}
    .mark{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#22c55e;color:#05200f;font-weight:900;font-size:24px}
    h1{font-size:24px;margin:0 0 4px} p{color:#94a3b8;margin:10px 0 0;line-height:1.5}
    .spin{width:18px;height:18px;border:3px solid #334155;border-top-color:#22c55e;border-radius:50%;animation:s .8s linear infinite;margin-top:18px}
    @keyframes s{to{transform:rotate(360deg)}}
    .err{display:none;color:#fecaca;background:#321318;border:1px solid #7f1d1d;border-radius:10px;padding:12px;margin-top:16px;white-space:pre-line}
    button{margin-top:12px;border:0;border-radius:10px;padding:10px 14px;background:#22c55e;color:#05200f;font-weight:800}
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="card">
      <div class="row"><div class="mark">W</div><div><h1>Well License Dashboard</h1><div style="color:#94a3b8">กำลังเปิดระบบ...</div></div></div>
      <div class="spin"></div>
      <div id="err" class="err"></div>
      <button id="retry" style="display:none" onclick="location.reload()">ลองใหม่</button>
    </div>
  </div>
<script>
(async()=>{
  const EDGE="https://sjcxywxixgrpdgeqaepk.supabase.co/functions/v1/well-license-dashboard";
  try {
    const r=await fetch(EDGE+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let t=await r.text();
    t=t.replace(
      "const FN=location.origin+location.pathname;",
      "const FN='"+EDGE+"';"
    );
    document.open();
    document.write(t);
    document.close();
  } catch(e) {
    document.querySelector('.spin').style.display='none';
    const box=document.getElementById('err');
    box.style.display='block';
    box.textContent='เปิด Dashboard ไม่สำเร็จ\n'+(e&&e.message?e.message:e);
    document.getElementById('retry').style.display='inline-block';
  }
})();
</script>
</body>
</html>
