<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Well License Dashboard</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0f14;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);background:#111827;border:1px solid #263244;border-radius:18px;padding:22px;box-sizing:border-box}
    .row{display:flex;align-items:center;gap:12px}
    .mark{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#22c55e;color:#05200f;font-weight:900;font-size:24px}
    h1{font-size:24px;margin:0 0 4px}.muted{color:#94a3b8}
    .spin{width:18px;height:18px;border:3px solid #334155;border-top-color:#22c55e;border-radius:50%;animation:s .8s linear infinite;margin-top:18px}
    @keyframes s{to{transform:rotate(360deg)}}
    .err{display:none;color:#fecaca;background:#321318;border:1px solid #7f1d1d;border-radius:10px;padding:12px;margin-top:16px;white-space:pre-line}
    button{margin-top:12px;border:0;border-radius:10px;padding:10px 14px;background:#22c55e;color:#05200f;font-weight:800}
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="card">
      <div class="row"><div class="mark">W</div><div><h1>Well License Dashboard</h1><div class="muted">กำลังเปิดระบบ...</div></div></div>
      <div class="spin"></div>
      <div id="err" class="err"></div>
      <button id="retry" style="display:none" onclick="location.reload()">ลองใหม่</button>
    </div>
  </div>
<script>
(async()=>{
  const EDGE="https://sjcxywxixgrpdgeqaepk.supabase.co/functions/v1/well-license-dashboard";
  const EXTRA=`(() => {
    let editingCustomerId='';
    document.addEventListener('click', e => {
      const b=e.target.closest && e.target.closest('[data-edit-customer]');
      if(b) editingCustomerId=b.getAttribute('data-edit-customer')||'';
    }, true);

    async function callCustom(action,payload={}){
      const tok=(typeof token!=='undefined'?token:(localStorage.getItem('well_admin_token')||localStorage.getItem('token')||''));
      const r=await fetch(window.__WELL_FN+'?custom=1',{
        method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+tok},
        body:JSON.stringify({action,...payload})
      });
      const j=await r.json().catch(()=>({ok:false,error:'server_error'}));
      if(!r.ok||!j.ok) throw new Error(j.error||'server_error');
      return j;
    }

    function addDeleteButton(){
      if(!editingCustomerId) return;
      const nodes=[...document.querySelectorAll('div,section,dialog')].filter(el=>{
        const s=getComputedStyle(el); const txt=el.textContent||'';
        return s.display!=='none' && s.visibility!=='hidden' && txt.includes('แก้ไขลูกค้า');
      }).sort((a,b)=>(a.textContent||'').length-(b.textContent||'').length);
      const modal=nodes[0];
      if(!modal || modal.querySelector('[data-delete-customer-modal]')) return;
      const btn=document.createElement('button');
      btn.type='button'; btn.className='btn danger'; btn.dataset.deleteCustomerModal='1';
      btn.textContent='ลบลูกค้า';
      btn.style.cssText='background:#dc2626;color:#fff;border-color:#dc2626;margin-left:8px';
      const area=[...modal.querySelectorAll('div')].reverse().find(x=>x.querySelector('button'))||modal;
      area.appendChild(btn);
      btn.onclick=async()=>{
        let name='';
        try{ if(typeof customers!=='undefined'){const c=customers.find(x=>String(x.id)===String(editingCustomerId));name=c?.name||c?.customer_name||'';} }catch{}
        if(!confirm('ยืนยันลบลูกค้า'+(name?' “'+name+'”':'')+' ?\nLicense เดิมจะยังอยู่')) return;
        btn.disabled=true; btn.textContent='กำลังลบ...';
        try{
          await callCustom('delete_customer',{id:editingCustomerId});
          if(typeof toast==='function') toast('ลบลูกค้าแล้ว');
          const close=[...modal.querySelectorAll('button')].find(x=>/ยกเลิก|ปิด/.test(x.textContent||'')); if(close) close.click();
          editingCustomerId='';
          if(typeof loadAll==='function') await loadAll();
        }catch(err){btn.disabled=false;btn.textContent='ลบลูกค้า'; if(typeof toast==='function')toast('ลบลูกค้าไม่สำเร็จ','bad'); else alert('ลบลูกค้าไม่สำเร็จ');}
      };
    }

    function renderLicenseWarnings(){
      const view=document.getElementById('view-licenses');
      if(!view || typeof licenses==='undefined') return;
      let box=document.getElementById('licenseWarningBox');
      if(!box){box=document.createElement('div');box.id='licenseWarningBox';box.className='panel';box.style.marginBottom='14px';view.prepend(box);}
      const today=new Date();today.setHours(0,0,0,0);
      const bad=[];
      for(const l of licenses){
        const exp=l.expires_at?new Date(String(l.expires_at).slice(0,10)+'T00:00:00'):null;
        const days=exp?Math.ceil((exp-today)/86400000):null;
        if(l.enabled===false) bad.push('ปิดใช้งาน: '+(l.customer_name||l.license_key||'-'));
        else if(days!==null && days<0) bad.push('หมดอายุ: '+(l.customer_name||l.license_key||'-'));
        else if(days!==null && days<=7) bad.push('ใกล้หมดอายุ '+days+' วัน: '+(l.customer_name||l.license_key||'-'));
      }
      box.innerHTML='<div class="panel-head"><div><div class="panel-title">แจ้งเตือน License</div><div class="panel-sub">หมดอายุ / ปิดใช้งาน / ใกล้หมดอายุภายใน 7 วัน</div></div></div>'+
        (bad.length?'<div class="stack">'+bad.map(x=>'<div class="backup-card" style="border-color:#7f1d1d">'+String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>').join('')+'</div>':'<div class="empty">ไม่มี License ที่ต้องแจ้งเตือน</div>');
    }

    const obs=new MutationObserver(()=>{try{addDeleteButton();renderLicenseWarnings();}catch{}});
    obs.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>{try{addDeleteButton();renderLicenseWarnings();}catch{}},700);
  })();`;
  try {
    const r=await fetch(EDGE+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let t=await r.text();
    t=t.replace("const FN=location.origin+location.pathname;","const FN='"+EDGE+"';");
    t=t.replace('</body>','<script>'+EXTRA.replace(/<\\/script>/gi,'<\\/script>')+'<\\/script></body>');
    document.open();document.write(t);document.close();
  } catch(e) {
    document.querySelector('.spin').style.display='none';
    const box=document.getElementById('err');box.style.display='block';
    box.textContent='เปิด Dashboard ไม่สำเร็จ\n'+(e&&e.message?e.message:e);
    document.getElementById('retry').style.display='inline-block';
  }
})();
</script>
</body>
</html>
