plugins {
    id 'com.android.application'
}

android {
    namespace 'com.well.rfscanner.v7'
    compileSdk 35

    defaultConfig {
        applicationId 'com.well.rfscanner.v7stable'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0-v7-stable-ui-usb'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
