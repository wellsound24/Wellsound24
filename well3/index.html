<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Well License Dashboard Standard 4</title><style>body{margin:0;background:#080d14;color:#fff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.card{padding:24px;border:1px solid #26364e;border-radius:16px;background:#101827}</style></head>
<body><div class="loading"><div class="card">กำลังเปิด Well License Dashboard...</div></div>
<script>
(async()=>{
  const ORIGIN='https://well-license-dashboard-next.vercel.app';
  function standard4Patch(){
    const q=s=>document.querySelector(s);
    const day=()=>new Date().toISOString().slice(0,10);
    const add=(iso,n)=>{const d=new Date((iso||day())+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
    const leftDays=iso=>Math.max(0,Math.round((new Date(iso+'T00:00:00Z')-new Date(day()+'T00:00:00Z'))/86400000));
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function remove30(){document.querySelectorAll('[data-renew-license]').forEach(x=>x.remove())}
    function syncDays(){const d=q('#fDays'),e=q('#fExpiry'),l=q('#fLifetime');if(!d||!e||!l)return;if(l.checked||!e.value){d.value='';return}d.value=String(leftDays(e.value))}
    function syncExpiry(){const d=q('#fDays'),e=q('#fExpiry'),l=q('#fLifetime');if(!d||!e||!l||l.checked||d.value==='')return;const n=Math.max(0,Math.min(3650,Math.floor(Number(d.value)||0)));d.value=String(n);e.value=add(day(),n)}
    function wireDays(){const d=q('#fDays'),e=q('#fExpiry'),l=q('#fLifetime');if(!d||d.dataset.wired)return;d.dataset.wired='1';d.addEventListener('input',syncExpiry);e.addEventListener('change',syncDays);l.addEventListener('change',()=>{d.disabled=l.checked;if(l.checked)d.value='';else syncDays()});syncDays()}

    async function webApi(action,payload={}){
      const token=sessionStorage.getItem('well_admin_session')||'';
      if(!token)throw new Error('unauthorized');
      const r=await fetch('/api/webrequest',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action,...payload})});
      const j=await r.json().catch(()=>({ok:false,error:'server_error'}));
      if(!r.ok||!j.ok)throw new Error(j.error||'server_error');
      return j;
    }

    function ensureLicenseWebPanel(){
      const toolbar=q('#view-licenses .toolbar');
      if(!toolbar||q('#webrequestDisplayPanel'))return;
      const left=toolbar.querySelector('.toolbar-left');
      if(!left)return;
      left.insertAdjacentHTML('afterend',`<div id="webrequestDisplayPanel" class="webrequest-inline">
        <div class="webrequest-label">WebRequest URL</div>
        <div class="webrequest-display-controls">
          <input id="webrequestDisplayInput" class="input" readonly placeholder="ยังไม่ได้บันทึก URL">
          <button id="webrequestCopyBtn" class="btn soft small" type="button" disabled>คัดลอก</button>
        </div>
        <div id="licenseWebrequestMsg" class="webrequest-msg"></div>
      </div>`);
      q('#webrequestCopyBtn').addEventListener('click',copyWebUrl);
    }

    function ensureSettingsWebPanel(){
      const grid=q('#view-settings .settings-grid');
      if(!grid||q('#webrequestSettingsPanel'))return;
      grid.insertAdjacentHTML('beforeend',`<div id="webrequestSettingsPanel" class="panel webrequest-settings-panel">
        <div class="panel-head"><div><div class="panel-title">ตั้งค่า WebRequest URL สำหรับลูกค้า</div><div class="panel-sub">แก้ไขและบันทึก URL ได้เฉพาะในหน้านี้ เพื่อลดการกดเปลี่ยนโดยไม่ตั้งใจ</div></div></div>
        <div class="webrequest-settings-controls">
          <input id="webrequestSettingsInput" class="input" placeholder="ใส่ URL เช่น https://...">
          <button id="webrequestSaveBtn" class="btn primary" type="button">บันทึก URL</button>
        </div>
        <div id="webrequestMsg" class="msg"></div>
        <div class="divider"></div>
        <div class="panel-head"><div><div class="panel-title">บันทึกย้อนหลัง</div><div class="panel-sub">นำ URL เก่ากลับมาใช้ได้ หรือลบรายการที่ไม่ต้องการ</div></div></div>
        <div id="webrequestHistory" class="stack"><div class="empty">ยังไม่มีประวัติ</div></div>
      </div>`);
      q('#webrequestSaveBtn').addEventListener('click',saveWebUrl);
      q('#webrequestHistory').addEventListener('click',handleHistoryClick);
    }

    function ensureWebPanels(){
      ensureLicenseWebPanel();
      ensureSettingsWebPanel();
    }

    function renderWebUrls(j){
      const display=q('#webrequestDisplayInput'),edit=q('#webrequestSettingsInput'),list=q('#webrequestHistory'),copy=q('#webrequestCopyBtn');
      const current=j.current||null, rows=Array.isArray(j.history)?j.history:[];
      const url=current?.url||'';
      if(display)display.value=url;
      if(edit)edit.value=url;
      if(copy)copy.disabled=!url;
      if(list)list.innerHTML=rows.length?rows.map(r=>`<div class="url-history-row ${r.is_current?'current':''}">
        <div class="url-history-main"><code>${esc(r.url)}</code><div class="subline">${new Date(r.created_at).toLocaleString('th-TH')}</div></div>
        <div class="row-actions">${r.is_current?'<span class="badge good"><span class="status-dot"></span>ใช้งานอยู่</span>':`<button class="btn small" type="button" data-restore-url="${r.id}">นำกลับมาใช้</button><button class="btn small danger" type="button" data-delete-url="${r.id}">ลบ</button>`}</div>
      </div>`).join(''):'<div class="empty">ยังไม่มีประวัติ</div>';
    }

    async function loadWebUrls(){
      ensureWebPanels();
      const token=sessionStorage.getItem('well_admin_session')||'';
      if(!token)return;
      const smsg=q('#webrequestMsg'),lmsg=q('#licenseWebrequestMsg');
      try{
        const j=await webApi('list');
        renderWebUrls(j);
        if(smsg)smsg.textContent='';
        if(lmsg)lmsg.textContent='';
      }catch(e){
        const text=e.message==='unauthorized'?'กรุณาเข้าสู่ระบบใหม่':'โหลด URL ไม่สำเร็จ';
        if(smsg)smsg.textContent=text;
        if(lmsg)lmsg.textContent=text;
      }
    }

    async function saveWebUrl(){
      const input=q('#webrequestSettingsInput'),msg=q('#webrequestMsg'),btn=q('#webrequestSaveBtn');
      const url=(input?.value||'').trim();
      if(!url){if(msg)msg.textContent='กรุณาใส่ URL ก่อนบันทึก';return}
      btn.disabled=true;if(msg)msg.textContent='กำลังบันทึก...';
      try{const j=await webApi('save',{url});renderWebUrls(j);if(msg)msg.textContent='บันทึกแล้ว • เก็บประวัติย้อนหลังเรียบร้อย'}catch(e){if(msg)msg.textContent=e.message==='invalid_url'?'URL ไม่ถูกต้อง กรุณาใส่ http:// หรือ https://':'บันทึกไม่สำเร็จ'}finally{btn.disabled=false}
    }

    async function copyWebUrl(){
      const input=q('#webrequestDisplayInput'),msg=q('#licenseWebrequestMsg'),url=(input?.value||'').trim();
      if(!url)return;
      try{await navigator.clipboard.writeText(url);if(msg)msg.textContent='คัดลอก URL แล้ว'}catch{input.focus();input.select();document.execCommand('copy');if(msg)msg.textContent='คัดลอก URL แล้ว'}
    }

    async function handleHistoryClick(e){
      const restore=e.target.closest('[data-restore-url]'),del=e.target.closest('[data-delete-url]'),msg=q('#webrequestMsg');
      if(restore){
        if(!confirm('นำ URL นี้กลับมาใช้เป็นค่าปัจจุบัน?'))return;
        try{const j=await webApi('restore',{id:restore.dataset.restoreUrl});renderWebUrls(j);msg.textContent='นำ URL เก่ากลับมาใช้แล้ว'}catch{msg.textContent='นำ URL กลับมาใช้ไม่สำเร็จ'}
      }
      if(del){
        if(!confirm('ลบบันทึกย้อนหลังรายการนี้?'))return;
        try{const j=await webApi('delete',{id:del.dataset.deleteUrl});renderWebUrls({history:j.history,current:(j.history||[]).find(x=>x.is_current)||null});msg.textContent='ลบบันทึกย้อนหลังแล้ว'}catch(e){msg.textContent=e.message==='cannot_delete_current'?'URL ที่กำลังใช้งานอยู่ลบไม่ได้':'ลบไม่สำเร็จ'}
      }
    }

    ensureWebPanels();remove30();wireDays();
    document.title='Well License Dashboard Standard 4';
    const licenseBtn=q('.nav-btn[data-view="licenses"]');if(licenseBtn)licenseBtn.addEventListener('click',()=>setTimeout(loadWebUrls,0));
    const settingsBtn=q('.nav-btn[data-view="settings"]');if(settingsBtn)settingsBtn.addEventListener('click',()=>setTimeout(loadWebUrls,0));
    const app=q('#appView');if(app){new MutationObserver(()=>{if(!app.classList.contains('hidden'))setTimeout(loadWebUrls,50)}).observe(app,{attributes:true,attributeFilter:['class']})}
    if(sessionStorage.getItem('well_admin_session'))loadWebUrls();
    const mo=new MutationObserver(()=>{remove30();wireDays();ensureWebPanels();const m=q('#licenseModal');if(m&&m.classList.contains('open'))setTimeout(syncDays,0)});
    mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  }

  try{
    let html=await (await fetch(ORIGIN+'/?std4='+Date.now(),{cache:'no-store'})).text();
    html=html.replace(/href="\/(license-next[^\"]+)"/g,'href="'+ORIGIN+'/$1"');
    html=html.replace(/src="\/(license-next[^\"]+)"/g,'src="'+ORIGIN+'/$1"');
    if(!html.includes('id="fDays"')){
      html=html.replace(
        '<div class="field"><label>วันหมดอายุ</label><input id="fExpiry" class="input" type="date" required><label class="lifetime-choice">',
        '<div class="field"><label>วันหมดอายุ</label><input id="fExpiry" class="input" type="date" required><div class="days-input-row"><span>ใช้ได้กี่วัน</span><input id="fDays" class="input days-input" type="number" min="0" max="3650" step="1" inputmode="numeric" placeholder="เช่น 30"><span>วัน</span></div><div class="field-help">พิมพ์จำนวนวัน แล้วระบบจะคำนวณวันหมดอายุให้อัตโนมัติ</div><label class="lifetime-choice">'
      );
    }
    const extraStyle='<style>[data-renew-license]{display:none!important}.days-input-row{display:grid;grid-template-columns:auto minmax(90px,150px) auto;align-items:center;gap:8px;margin-top:9px}.days-input-row span{font-size:12px;color:#b9c4d4}.days-input{min-height:38px!important}.webrequest-inline{flex:1;min-width:360px;max-width:720px;padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:#0e1827}.webrequest-label{font-size:10px;font-weight:800;color:#91a0b6;margin-bottom:5px}.webrequest-display-controls{display:grid;grid-template-columns:minmax(170px,1fr) auto;gap:6px;align-items:center}.webrequest-display-controls .input{min-height:34px;padding:6px 9px;font-size:12px;cursor:default}.webrequest-msg{font-size:10px;color:var(--muted);min-height:12px;margin-top:4px}.webrequest-settings-panel{grid-column:1/-1}.webrequest-settings-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.url-history-row{border:1px solid var(--line);background:#0f1928;border-radius:11px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.url-history-row.current{border-color:#275d43}.url-history-main{min-width:0;flex:1}.url-history-main code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dce7f5}@media(max-width:1100px){#view-licenses .toolbar{align-items:flex-start}.webrequest-inline{order:3;flex-basis:100%;max-width:none;min-width:0}.webrequest-display-controls{grid-template-columns:minmax(0,1fr) auto}}@media(max-width:700px){.days-input-row{grid-template-columns:auto 1fr auto}.webrequest-display-controls{grid-template-columns:1fr auto}.webrequest-settings-controls{grid-template-columns:1fr}.webrequest-settings-controls .btn{width:100%}.url-history-row{align-items:flex-start;flex-direction:column}.url-history-main code{white-space:normal;word-break:break-all}}</style>';
    html=html.replace('</head>',extraStyle+'</head>');
    const patch='<script>('+standard4Patch.toString()+')();<\/script>';
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading"><div class="card">เปิด Dashboard ไม่สำเร็จ กรุณาลองใหม่</div></div>'}
})();
</script></body></html>
